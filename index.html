<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hệ thống quản lý công tác – Hạt Kiểm lâm Tương Dương</title>
<meta name="theme-color" content="#1f5c3a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="config.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root{--g:#1f5c3a;--g2:#2e7d4f;--bg:#f3f6f4;--tx:#1d2b24;--mut:#6b7a72;--line:#dfe6e2;--red:#c0392b;--sel:#2e7d4f}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--tx);font-size:17px;line-height:1.4}
header{background:var(--g);color:#fff;padding:8px 12px;position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px}
header .logo{height:46px;width:auto;flex:none}
header .phai{min-width:34px;display:flex;gap:6px;justify-content:flex-end;align-items:center;flex:none}
header h1{margin:0;font-size:clamp(12px,3.75vw,21px);flex:1;min-width:0;text-align:center;line-height:1.25}
header h1 #donvi{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header small{opacity:.9;display:block;font-weight:normal;font-size:clamp(12px,3.5vw,15px)}
header .back{cursor:pointer;font-size:28px;padding:0 10px 0 2px;line-height:1}
main{max-width:820px;margin:0 auto;padding:14px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px}
.hello{font-size:21px;font-weight:bold;margin:0 0 8px}
.chip{display:inline-block;background:#e6f2ea;color:var(--g);border-radius:20px;padding:5px 12px;font-size:15px;margin:2px 4px 2px 0}
.chip.x{background:#fdecea;color:var(--red)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:620px){.grid{grid-template-columns:repeat(3,1fr)}}
.tile{background:#fff;border:1px solid var(--line);border-top:4px solid var(--g2);border-radius:12px;padding:14px 10px;text-align:center;cursor:pointer;min-height:96px;position:relative}
.tile .ic{font-size:26px}.tile .t{font-weight:bold;margin-top:6px;font-size:14px}.tile .s{color:var(--mut);font-size:12px;margin-top:2px}
.tile.off{opacity:.55;cursor:default;border-top-color:#b5bfba}
/* trang chủ: 6 ô lớn chia đều màn hình điện thoại */
html.dt-gia main.home{min-height:calc(var(--hthat) - 66px)}
html.dt-gia header h1{font-size:15.5px}
html.dt-gia header small{font-size:13.5px}
main.home{display:flex;flex-direction:column;min-height:calc(100vh - 66px);min-height:calc(100svh - 66px);box-sizing:border-box}
main.home .chao{padding:10px 14px;margin-bottom:10px}
main.home .chao .chip{font-size:13px;padding:3px 9px;margin:1px 3px 1px 0}
main.home .chao .mut{font-size:14px}
main.home .chao .hello{font-size:20px;margin:0 0 4px}
.grid.g6{flex:1;grid-template-columns:1fr 1fr;grid-template-rows:repeat(3,minmax(120px,1fr));gap:10px}
.grid.g6 .tile{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:0;padding:12px 8px;border-top-width:6px}
.grid.g6 .tile .ic{font-size:58px;line-height:1.05}
.grid.g6 .tile .t{font-size:22px;line-height:1.2;margin-top:8px}
.grid.g6 .tile .s{font-size:15px;line-height:1.25;margin-top:4px}
.grid.g6 .badge{font-size:15px;padding:2px 10px;top:10px;right:12px}
@media(max-width:380px){.grid.g6 .tile .ic{font-size:56px}.grid.g6 .tile .t{font-size:21px}.grid.g6 .tile .s{font-size:15px}}
@media(min-width:900px) and (orientation:landscape) and (pointer:fine){.grid.g6{grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,minmax(180px,1fr))}.grid.g6 .tile .ic{font-size:72px}.grid.g6 .tile .t{font-size:24px}}
.grid.qt{grid-template-columns:repeat(3,1fr);margin-top:12px}
.grid.qt .tile{min-height:0;padding:10px 6px}.grid.qt .tile .ic{font-size:26px}.grid.qt .tile .t{font-size:15px}.grid.qt .tile .s{display:none}
.cochu{display:inline-flex;gap:4px;align-items:center}
.cochu span{border:1px solid var(--line);border-radius:8px;padding:2px 9px;cursor:pointer;font-weight:bold;color:var(--g)}
.cochu span.on{background:var(--g);color:#fff;border-color:var(--g)}
.badge{position:absolute;top:8px;right:10px;background:var(--red);color:#fff;border-radius:12px;font-size:12px;padding:1px 8px}
button,select,input,textarea{font:inherit;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--tx)}
button{cursor:pointer}
button.p{background:var(--g2);color:#fff;border-color:var(--g2)}
button.d{background:#fff;color:var(--red);border-color:var(--red)}
button.s{background:#fff;color:var(--g2);border-color:var(--g2)}
button:disabled{opacity:.5}
select,input[type=text],input[type=number],input[type=month],textarea{width:100%}
label.l{display:block;font-weight:bold;font-size:16px;margin:14px 0 5px;color:#33443b}
label.l i{color:var(--red);font-style:normal}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding:10px 0}
.row:last-child{border-bottom:none}
.mut{color:var(--mut);font-size:15px}.err{color:var(--red)}
.link{color:var(--g2);cursor:pointer;text-decoration:underline}
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tabs button{flex:1}.tabs button.on{background:var(--g2);color:#fff;border-color:var(--g2)}
.seg{display:flex;gap:6px}.seg label{flex:1;text-align:center;border:1px solid var(--line);border-radius:8px;padding:9px 4px;cursor:pointer;background:#fff}
.seg input{display:none}.seg input:checked+span{font-weight:bold;color:#fff}
.seg label.on{background:var(--sel);color:#fff;border-color:var(--sel)}
.cal{border:1px solid var(--line);border-radius:10px;padding:8px;background:#fff}
.cal .h{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.cal .h button{padding:4px 12px}
.cal table{width:100%;border-collapse:collapse;table-layout:fixed}
.cal th{font-size:14px;color:var(--mut);padding:3px 0}
.cal td{text-align:center;padding:2px}
.cal td div{padding:10px 0;border-radius:8px;cursor:pointer;font-size:17px}
.cal td div.today{border:1px solid var(--g2)}
.cal td div.sel{background:var(--sel);color:#fff;font-weight:bold}
.cal td div.dis{color:#c4cbc7;cursor:default}
.sels{margin-top:6px}
.pick{max-height:220px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:4px 10px;background:#fff}
.pick label{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #f0f3f1;cursor:pointer}
.pick label:last-child{border-bottom:none}
.pick input{width:20px;height:20px;padding:0}
.item{border:1px solid var(--line);border-left:5px solid var(--g2);border-radius:10px;padding:10px 12px;margin-bottom:10px;background:#fff}
.item .top{display:flex;justify-content:space-between;gap:8px}
.item .hd{font-weight:bold}
.item .btns{margin-top:8px;display:flex;gap:8px}
.item .btns button{padding:6px 12px}
.ok{background:#e6f2ea;border:1px solid #b9dcc6;border-radius:10px;padding:12px;margin-top:12px}
.bad{background:#fdecea;border:1px solid #f1b9b2;border-radius:10px;padding:12px;margin-top:12px;color:#7d261c}
.item.st-ok{border-left-color:#2e7d4f}.item.st-late{border-left-color:#b8860b}.item.st-bad{border-left-color:#c0392b}.item.st-doing{border-left-color:#3b7f9e}
.chip.st-ok{background:#e6f2ea;color:#1f5c3a}.chip.st-late{background:#fff3d6;color:#8a6a00}.chip.st-bad{background:#fdecea;color:#c0392b}.chip.st-doing{background:#e3f0f7;color:#1f5a7a}
.hint{color:var(--mut);font-size:14px;margin:4px 0}
.gt{font-weight:bold;color:var(--g);margin:16px 0 2px;padding-bottom:4px;border-bottom:2px solid #e6f2ea}
.warn{background:#fff3d6;border:1px solid #f0d58a;border-radius:10px;padding:12px;margin-top:12px;color:#7a5a00}
.lnav{display:flex;gap:6px;align-items:center}.lnav input{flex:1;text-align:center}.lnav button{padding:9px 14px}
.lcal{width:100%;border-collapse:collapse;table-layout:fixed}
.lcal th{font-size:12px;color:var(--mut);padding:4px 0}
.lcal td{border:1px solid var(--line);vertical-align:top;height:66px;padding:2px;background:#fff;cursor:pointer;overflow:hidden}
.lcal td.we{background:#eef6ea}.lcal td.tr{outline:2px solid var(--red);outline-offset:-2px}.lcal td.hn{box-shadow:inset 0 0 0 2px var(--g2)}.lcal td.sl{background:#d6ecde}
.lcal td .n{font-size:12px;color:var(--mut)}
.cd{display:inline-block;font-size:10px;font-weight:bold;border-radius:4px;padding:1px 4px;margin:1px 1px 0 0;background:#e6f2ea;color:var(--g)}
.cd.nghi{background:#e3f0f7;color:#1f5a7a}.cd.bad{background:#fdecea;color:var(--red)}
.hatw{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:#fff}
table.hat{border-collapse:collapse;font-size:12px}
table.hat th,table.hat td{border:1px solid var(--line);padding:3px 4px;text-align:center;min-width:34px}
table.hat td.nm,table.hat th.nm{position:sticky;left:0;background:#fff;text-align:left;min-width:130px;max-width:150px;z-index:1;white-space:nowrap}
table.hat .we{background:#eef6ea}table.hat td.tr{background:#fdecea;color:var(--red);font-weight:bold}
table.hat .me td.nm{background:#e6f2ea;font-weight:bold}
.kg{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px}
@media(min-width:620px){.kg{grid-template-columns:repeat(3,1fr)}}
.kpi{background:#fff;border:1px solid var(--line);border-top:4px solid var(--g2);border-radius:12px;padding:10px 8px;text-align:center}
.kpi .kl{font-size:11px;font-weight:bold;color:#596b62}.kpi .kv{font-size:22px;font-weight:bold;margin:4px 0}.kpi .ks{font-size:11px;color:var(--mut)}
.bars .br{display:flex;align-items:center;gap:8px;margin:5px 0;font-size:13px}
.bars .bl{width:120px;flex:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bars .bt{flex:1;background:#eef2f0;border-radius:6px;height:16px;overflow:hidden}.bars .bf{height:100%;border-radius:6px}
.bars .bv{width:70px;flex:none;text-align:right;font-weight:bold}
.cols{display:flex;align-items:flex-end;gap:4px;height:150px;margin-top:8px}
.cols .cc{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.cols .cb{width:100%;border-radius:4px 4px 0 0;min-height:1px}.cols .cn{font-size:9px;color:var(--mut)}.cols .ct{font-size:9px}
.net{background:#c0392b;color:#fff;font-size:11px;padding:3px 8px;border-radius:10px}
.hc{background:#fff;color:var(--g);font-size:12px;font-weight:bold;padding:3px 8px;border-radius:10px;cursor:pointer}
.hc.loi{background:#fbe3e0;color:#c0392b}
.toast{position:fixed;left:50%;bottom:32px;transform:translateX(-50%);background:#1d2b24;color:#fff;padding:12px 18px;border-radius:12px;font-size:16px;z-index:60;max-width:90%}
.capnhat{position:fixed;left:0;right:0;bottom:0;background:#fff8e1;border-top:2px solid #e0b000;padding:10px 14px;display:flex;gap:12px;align-items:center;justify-content:center;z-index:70;font-size:16px}
.capnhat .p{width:auto;padding:8px 16px}
.sync{font-size:18px;opacity:.85;animation:quay 1.2s linear infinite}
@keyframes quay{to{transform:rotate(360deg)}}
.gbtn{display:flex;justify-content:center;margin:16px 0 6px;min-height:44px}
.stack{display:flex;height:22px;border-radius:6px;overflow:hidden;margin:8px 0}
main.wide{max-width:1160px}
.chg{display:grid;grid-template-columns:1fr;gap:0 12px}
@media(min-width:760px){.chg{grid-template-columns:1fr 1fr}.chg .full{grid-column:1 / -1}}
.card.ch .gt{margin-top:0}
.lg{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:#33443b;margin:8px 0 4px}
.lg i,.dlg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.hc{margin-top:6px}
.hr{display:flex;align-items:center;gap:8px;padding:4px 0;border-bottom:1px solid #f0f3f1}
.hr:last-child{border-bottom:none}
.hl{width:118px;flex:none;font-size:12px;color:#33443b;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbs{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0}
.hb{display:flex;align-items:center;gap:6px;height:12px}
.hf{height:12px;border-radius:0 4px 4px 0;min-width:0;cursor:default}
.hv{font-size:11px;color:#52514e;white-space:nowrap}
.vch{display:flex;align-items:stretch;gap:3px;height:170px;margin-top:8px;border-bottom:1px solid #cfd8d3}
.vc{flex:1;display:flex;flex-direction:column;align-items:center;min-width:0;border-radius:4px 4px 0 0}
.vc.in{background:#f1f6f3}
.vt{font-size:9px;color:#52514e;height:13px;white-space:nowrap}
.vbs{flex:1;width:100%;display:flex;align-items:flex-end;justify-content:center;gap:2px}
.vf{flex:1;max-width:24px;border-radius:4px 4px 0 0;cursor:default}
.vn{font-size:10px;color:var(--mut);padding-top:2px}
.dnw{display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin-top:6px}
.dn{width:150px;height:150px}.dn circle{cursor:default}.dnv{font-size:24px;font-weight:bold;fill:#1d2b24}
.dlg div{display:flex;align-items:center;gap:4px;font-size:13px;margin:4px 0}.dlg b{margin-left:8px}
.kpi{border-top-color:#cfd8d3}.kpi .kv{color:#1d2b24}
.tip{position:absolute;z-index:50;background:#1d2b24;color:#fff;font-size:12px;padding:5px 8px;border-radius:6px;pointer-events:none;display:none;max-width:260px}
table.hat td.on{box-shadow:inset 0 0 0 2px var(--g2);background:#d6ecde}
table.cmt td{max-width:92px;min-width:56px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer;font-size:11px}
table.tbl{border-collapse:collapse;font-size:12px;width:100%}table.tbl th,table.tbl td{border:1px solid var(--line);padding:4px 6px;text-align:right}
table.tbl th{background:#e6f2ea}table.tbl td:first-child,table.tbl th:first-child{text-align:left;position:sticky;left:0;background:#fff}
@media print{header,.tabs,.noprint,#back{display:none!important}body{background:#fff}.card,.kpi{break-inside:avoid}}
</style>
</head>
<body>
<header><span class="back" id="back" style="display:none">&#8592;</span><img class="logo" src="logo.png" alt="Kiểm lâm"><h1><span id="donvi">HẠT KIỂM LÂM TƯƠNG DƯƠNG</span><small>Hệ thống quản lý công tác</small></h1><span class="phai"><span id="hc" class="hc" style="display:none"></span><span id="sync" class="sync" style="display:none" title="Đang cập nhật dữ liệu mới">⟳</span><span id="net" class="net" style="display:none">Mất mạng</span></span></header>
<main id="app"><div class="card">Đang tải…</div></main>
<script>
var $=function(id){return document.getElementById(id)};
var ME=null, CFG=null;
/* ===== KẾT NỐI MÁY CHỦ (ứng dụng PWA gọi thẳng cổng dữ liệu Apps Script) ===== */
var CH=window.CAU_HINH||{};
var PHIEN_KEY='qlct_phien';
function phien(){try{return JSON.parse(localStorage.getItem(PHIEN_KEY)||'null')}catch(e){return null}}
function luuPhien(token,exp,email){try{localStorage.setItem(PHIEN_KEY,JSON.stringify({token:token,exp:exp,email:email||((phien()||{}).email)||''}))}catch(e){}}
function xoaPhien(){try{localStorage.removeItem(PHIEN_KEY)}catch(e){}}
function post(body){
  if(!CH.API_URL)return Promise.reject(new Error('Chưa cấu hình API_URL trong config.js.'));
  return fetch(CH.API_URL,{method:'POST',body:JSON.stringify(body),redirect:'follow'})
    .catch(function(){var e=new Error(navigator.onLine?'Không kết nối được máy chủ. Thử lại sau ít phút.':'Không có mạng. Kiểm tra kết nối rồi thử lại.');e.mang=true;throw e})
    .then(function(r){return r.text()})
    .then(function(t){try{return JSON.parse(t)}catch(e){throw new Error('Máy chủ trả về dữ liệu không hợp lệ. Kiểm tra API_URL và bản triển khai Cổng dữ liệu.')}});
}
function call(action,params,khongXepHang){
  var ph=phien();
  if(!ph||!ph.token){dangNhapView();return new Promise(function(){})}
  params=params||{};
  var xh=HANG_CHO_ACT[action]&&!khongXepHang;
  if(xh){
    if(!params.cid)params.cid=Date.now().toString(36)+Math.random().toString(36).slice(2,10);
    if(!navigator.onLine)return Promise.resolve(xepHang(action,params));
  }
  return post({pwa:1,action:action,params:params,token:ph.token}).catch(function(e){
    if(xh&&e&&e.mang)return {__offline:xepHang(action,params)};
    throw e;
  }).then(function(r){
    if(r&&r.__offline)return r.__offline;
    if(r&&r.loai==='PHIEN_HET_HAN'){xoaPhien();dangNhapView(r.message);return new Promise(function(){})}
    if(r&&r._token){luuPhien(r._token,r._exp);delete r._token;delete r._exp}
    if(r&&r.khoa&&typeof r.khoa==='string'&&ME&&ME.state==='OK'){ME.khoa=ME.khoa||{};ME.khoa[r.khoa]=ME.khoa[r.khoa]||{lyDo:''}}
    if(!CHI_DOC[action]&&r&&r.ok){cxoa('v',!GHI_XOA_HET[action]);if(GHI_XOA_HET[action])cxoa('c')}
    return r;
  });
}
/* ===== LƯU DỮ LIỆU TRÊN MÁY (giai đoạn 2) =====
   callView: màn hình xem – hiện ngay bản đã lưu, tải bản mới ngầm, khác thì vẽ lại (nếu người dùng chưa chuyển màn hình).
   callCfg : cấu hình form – dùng bản đã lưu, làm mới ngầm cho lần sau.
   Ghi/sửa/xóa thành công → xóa bản lưu của các màn hình xem. */
var VIEW=0,LATEST={},PENDING=0;
var GHI_XOA_HET={QT_SUA_NGUOI:1,QT_DOI_NAM:1,DUYET:1,GUI_YEU_CAU:1};
var CHI_DOC={PUSH_DANGKY:1,PUSH_HUY:1,PUSH_THU:1,ME:1,NK_CAUHINH:1,NV_CAUHINH:1,SLT_CAUHINH:1,NK_DS:1,NV_DS:1,SLT_DS:1,SLT_LAY:1,LICH_THANG:1,BC_TINH:1,CM_LAY:1,QT_CAUHINH:1,DS_YEU_CAU:1};
function ckey(kind,action,params){return 'qlct_c:'+((phien()||{}).email||'')+':'+kind+':'+action+':'+JSON.stringify(params||{})}
function cget(k){try{var o=JSON.parse(localStorage.getItem(k)||'null');if(o&&Date.now()-o.t<30*864e5)return o}catch(e){}return null}
function cset(k,d){
  var v=JSON.stringify({t:Date.now(),d:d});
  try{localStorage.setItem(k,v)}catch(e){cdon(true);try{localStorage.setItem(k,v)}catch(e2){}}
}
function ckeys(){var a=[];try{for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(k&&k.indexOf('qlct_c:')===0)a.push(k)}}catch(e){}return a}
/* đầy bộ nhớ: xóa một nửa bản lưu cũ nhất */
function cdon(){var a=ckeys().map(function(k){var o=cget(k);return {k:k,t:o?o.t:0}}).sort(function(x,y){return x.t-y.t});a.slice(0,Math.ceil(a.length/2)).forEach(function(x){try{localStorage.removeItem(x.k)}catch(e){}})}
function cxoa(kind,giuME){ckeys().forEach(function(k){var p=k.split(':');if((!kind||p[2]===kind)&&!(giuME&&p[3]==='ME'))try{localStorage.removeItem(k)}catch(e){}})}
function dongBoHien(){var n=$('sync');if(n)n.style.display=PENDING>0?'':'none'}
function callView(action,params){
  var k=ckey('v',action,params),hit=cget(k),okFns=[],errFns=[],v1=-1,my=LATEST[action]=(LATEST[action]||0)+1;
  var obj={then:function(f){okFns.push(f);return obj},catch:function(f){errFns.push(f);return obj}};
  function fire(d){okFns.forEach(function(f){f(d)})}
  setTimeout(function(){
    if(hit){fire(hit.d);v1=VIEW}
    PENDING++;dongBoHien();
    call(action,params).then(function(r){
      PENDING--;dongBoHien();
      if(r&&r.ok)cset(k,r);
      var s1=hit?JSON.stringify(hit.d):'';

var FB_VER='10.13.2',MSG=null;

function makePick(users,chosen,single,onchange){
  var box=el('div',{class:'pick'}),inputs={};
  var search=el('input',{type:'text',placeholder:'Tìm tên…'});
  users.forEach(function(n){
    var cb=el('input',{type:'checkbox'});cb.checked=!!chosen[n.ten];inputs[n.ten]=cb;
    cb.addEventListener('change',function(){
      if(single&&cb.checked){Object.keys(chosen).forEach(function(k){delete chosen[k]});Object.keys(inputs).forEach(function(k){if(inputs[k]!==cb)inputs[k].checked=false})}
      if(cb.checked)chosen[n.ten]=true;else delete chosen[n.ten];
      if(onchange)onchange();
    });
    box.appendChild(el('label',{'data-n':n.ten.toLowerCase()},[cb,el('span',{text:n.ten+(n.dia?' ('+n.dia+')':'')})]));
  });
  search.addEventListener('input',function(){
    var q=search.value.toLowerCase();
    Array.prototype.forEach.call(box.children,function(lb){lb.style.display=lb.getAttribute('data-n').indexOf(q)>=0?'':'none'});
  });
  return {search:search,box:box};
}

/* Báo hoàn thành: mở mẫu nhật ký điền sẵn từ nhiệm vụ */
function nvHdGoiY(e){
  var ds=(CFG.hoatDong||[]).filter(function(h){return !h.nghi});
  function by(f){for(var i=0;i<ds.length;i++)if(f(ds[i]))return ds[i].name;return ''}
  if(e.hdNk&&by(function(h){return h.name===e.hdNk}))return e.hdNk;
  if(e.loai==='Tham mưu văn bản')return by(function(h){return h.code==='VB'});
  if(e.loai==='Hồ sơ thanh toán')return by(function(h){return h.code==='HSTT'});
  var t=(e.ten||'').toLowerCase();
  return by(function(h){return t.indexOf(h.name.toLowerCase())>=0})||'';
}
function nvBaoXong(e){
  if(ME.khoa&&ME.khoa.NK&&!(ME.caps&&ME.caps.quanTri)){   // nhật ký đang khóa: chỉ báo hoàn thành
    if(!confirm('Xác nhận báo hoàn thành?\nNgày hoàn thành sẽ tự ghi là hôm nay.'))return;
    call('NV_XONG',{ma:e.ma}).then(function(x){if(x&&x.ok)nvRender('ds');else alert((x&&x.message)||'Không xử lý được.')}).catch(function(er){alert(errMsg(er))});
    return;
  }
  function mo(){
    var hd=nvHdGoiY(e),f={};
    if(e.loai==='Tham mưu văn bản')f.vb_ty=e.ten;
    var body=el('div',{});
    show([body],function(){nvRender('ds')});
    nkForm(body,null,{nv:{ma:e.ma,ten:e.ten},hd:hd,nd:e.loai==='Tham mưu văn bản'?'Tham mưu văn bản: '+e.ten:e.ten,cung:e.cung||[],ngay:CFG.homNay,nhap:e.nhan,f:f});
  }
  if(CFG){mo();return}
  show([msgCard('Đang tải mẫu nhật ký…')],function(){nvRender('ds')});
  callCfg('NK_CAUHINH',function(r){CFG=r}).then(function(r){
    if(!r||!r.ok){show([msgCard((r&&r.message)||'Lỗi',true)],function(){nvRender('ds')});return}
    CFG=r;mo();
  }).catch(function(er){show([msgCard('Lỗi: '+errMsg(er),true)],function(){nvRender('ds')})});
}
var TT_CLASS={'Hoàn thành':'st-ok','Hoàn thành chậm':'st-late','Chưa hoàn thành':'st-bad','Đang thực hiện':'st-doing'};
function nvList(body){
  var tt=el('select',{},['','Chưa hoàn thành','Đang thực hiện','Hoàn thành chậm','Hoàn thành'].map(function(x){return el('option',{value:x,text:x||'Mọi trạng thái'})}));
  var tatCa=null,nguoi=null,list=el('div',{});
  var ctr=[];
  if(NVCFG.xemTatCa){
    tatCa=el('select',{},[el('option',{value:'',text:'Chỉ của tôi'}),el('option',{value:'1',text:'Tất cả cán bộ'})]);
    nguoi=el('select',{},[el('option',{value:'',text:'Mọi người'})].concat(NVCFG.nguoi.map(function(n){return el('option',{value:n.ten,text:n.ten})})));
    ctr.push(el('label',{class:'l',text:'Phạm vi'}),tatCa,el('label',{class:'l',text:'Lọc theo người'}),nguoi);
  }
  ctr.push(el('label',{class:'l',text:'Trạng thái'}),tt,el('p',{},[el('button',{class:'p',text:'Xem',onclick:load})]));
  body.appendChild(el('div',{class:'card'},ctr));body.appendChild(list);
  function load(){
    list.innerHTML='';list.appendChild(msgCard('Đang tải…'));
    callView('NV_DS',{tatCa:tatCa?!!tatCa.value:false,nguoi:nguoi?nguoi.value:'',trangThai:tt.value}).then(function(r){
      list.innerHTML='';
      if(!r||!r.ok){list.appendChild(msgCard((r&&r.message)||'Lỗi',true));return}
      list.appendChild(el('p',{class:'mut',text:r.tong+' nhiệm vụ'}));
      if(!r.ds.length)list.appendChild(el('div',{class:'card mut',text:'Không có nhiệm vụ nào.'}));
      r.ds.forEach(function(e){
        var cls=TT_CLASS[e.tt]||'';
        var kids=[el('div',{class:'hd',text:e.ten}),
          el('div',{},[el('span',{class:'chip '+cls,text:e.tt}),el('span',{class:'chip',text:e.loai}),e.tuNhap?el('span',{class:'chip',text:'Tự thêm'}):null]),
          (e.vbSo||e.vbNgay)?el('div',{class:'mut',text:'Văn bản: '+(e.vbSo||'(chưa có số)')+(e.vbNgay?' ngày '+fmtVN(e.vbNgay):'')}):null,
          el('div',{class:'mut',text:'Hạn: '+fmtVN(e.han)+(e.sl!==''&&e.sl!==null?' · SL: '+e.sl:'')+(e.xong?' · Hoàn thành: '+fmtVN(e.ngayxong):'')}),
          el('div',{class:'mut',text:'Người nhận: '+e.nhan+(e.cung.length?' · Phối hợp: '+e.cung.join(', '):'')}),
          el('div',{class:'mut',text:e.ma+' · giao ngày '+fmtVN(e.giao)+(e.nguoiGiao?' · người giao: '+e.nguoiGiao:'')})];
        var btns=[];
        if(e.baoXong)btns.push(el('button',{class:'p',text:'Báo hoàn thành',onclick:function(){nvBaoXong(e)}}));
        if(e.sua)btns.push(el('button',{class:'s',text:'Sửa',onclick:function(){nvRender(e.tuNhap&&!NVCFG.giaoViec?'tu':'giao',e)}}));
        if(e.sua)btns.push(el('button',{class:'d',text:'Xóa',onclick:function(){
          if(!confirm('Xóa nhiệm vụ '+e.ma+'?'))return;
          call('NV_XOA',{ma:e.ma}).then(function(x){if(x&&x.ok)load();else alert((x&&x.message)||'Không xóa được.')}).catch(function(er){alert(errMsg(er))});
        }}));
        if(e.moLai)btns.push(el('button',{class:'s',text:'Mở lại',onclick:function(){
          if(!confirm('Mở lại nhiệm vụ '+e.ma+'? Ngày hoàn thành sẽ bị xóa.'))return;
          call('NV_MOLAI',{ma:e.ma}).then(function(x){if(x&&x.ok)load();else alert((x&&x.message)||'Không xử lý được.')}).catch(function(er){alert(errMsg(er))});
        }}));
        if(btns.length)kids.push(el('div',{class:'btns'},btns));
        list.appendChild(el('div',{class:'item '+cls},kids));
      });
    }).catch(function(e){list.innerHTML='';list.appendChild(msgCard('Lỗi: '+errMsg(e),true))});
  }
  load();
}
/* ---------- SỐ LIỆU THÁNG ---------- */
var SLTCFG=null;
function sltHome(tab,preset){
  if(SLTCFG){sltRender(tab||'nhap',preset);return}
  show([msgCard('Đang tải…')],boot);
  callCfg('SLT_CAUHINH',function(r){SLTCFG=r}).then(function(r){
    if(!r||!r.ok){show([msgCard((r&&r.message)||'Lỗi',true)],boot);return}
    SLTCFG=r;sltRender(tab||'nhap',preset);
  }).catch(function(e){show([msgCard('Lỗi: '+errMsg(e),true,[retry(function(){sltHome()})])],boot)});
}
function sltRender(tab,preset){
  var t1=el('button',{class:tab==='nhap'?'on':'',text:'Nhập số liệu',onclick:function(){sltRender('nhap')}});
  var t2=el('button',{class:tab==='ds'?'on':'',text:'Đã nhập',onclick:function(){sltRender('ds')}});
  var body=el('div',{});
  show([el('div',{class:'tabs'},[t1,t2]),body],function(){boot()});
  if(tab==='nhap')sltForm(body,preset);else sltList(body);
}
function sltForm(body,preset){
  preset=preset||{};
  var thang=el('input',{type:'month',value:preset.thang||SLTCFG.thangHienTai});
  if(!SLTCFG.quanTri)thang.setAttribute('max',SLTCFG.thangHienTai);
  var xa=el('select',{},[el('option',{value:'',text:'— Chọn xã —'})].concat(SLTCFG.xaOk.map(function(x){return el('option',{value:x,text:x})})));
  xa.value=preset.xa||(SLTCFG.xaOk.indexOf(SLTCFG.dia)>=0?SLTCFG.dia:(SLTCFG.xaOk.length===1?SLTCFG.xaOk[0]:''));
  var dt=el('select',{},[el('option',{value:'',text:'Số liệu chung của xã'})].concat(SLTCFG.doiTuong.map(function(x){return el('option',{value:x,text:x})})));
  dt.value=preset.dt||'';
  var nguoi=preset.nguoi&&preset.nguoi!==SLTCFG.ten?preset.nguoi:'';
  var banner=el('div',{class:'hint'}),fieldBox=el('div',{}),gc=el('input',{type:'text',placeholder:'Ghi chú (không bắt buộc)'}),msg=el('div',{});
  var token=0,btn=el('button',{class:'p',text:'Lưu số liệu',onclick:save});
  function drawFields(){
    fieldBox.innerHTML='';
    var nhom=dt.value?SLTCFG.nhomDt:SLTCFG.nhomXa;
    if(dt.value)fieldBox.appendChild(el('div',{class:'hint',text:'Đối tượng này chỉ ghi số đợt và số người tuần tra, tuyên truyền.'}));
    nhom.forEach(function(g){
      fieldBox.appendChild(el('div',{class:'gt',text:g.title}));
      var ro=g.fields.some(function(f){return f.ro});
      if(ro)fieldBox.appendChild(el('div',{class:'hint',text:'Tự cộng từ nhật ký "Theo dõi, cập nhật diễn biến rừng" (không nhập ở đây). Thiếu thì bổ sung nhật ký.'}));
      g.fields.forEach(function(f){
        var inp=el('input',{type:'text',inputmode:f.t==='int'?'numeric':'decimal'});inp.setAttribute('data-k',f.k);
        if(f.ro){inp.disabled=true;inp.style.background='#f3f6f4'}
        fieldBox.appendChild(el('label',{class:'l',text:f.label}));fieldBox.appendChild(inp);
      });
    });
  }
  function lay(){
    drawFields();gc.value='';banner.textContent='';msg.innerHTML='';
    if(!xa.value||!thang.value)return;
    var my=++token;banner.textContent='Đang kiểm tra số liệu đã nhập…';
    call('SLT_LAY',{thang:thang.value,xa:xa.value,dt:dt.value,nguoi:nguoi}).then(function(r){
      if(my!==token)return;
      if(!r||!r.ok){banner.textContent=(r&&r.message)||'';banner.className='hint err';return}
      banner.className='hint';
      if(r.co){
        banner.textContent='Đã có số liệu của '+(nguoi||'bạn')+' cho kỳ này – đang sửa. Lưu sẽ ghi đè.';
        Array.prototype.forEach.call(fieldBox.querySelectorAll('[data-k]'),function(i){var v=r.f[i.getAttribute('data-k')];i.value=(v===''||v===undefined||v===null)?'':String(v)});
        gc.value=r.gc||'';
      }else banner.textContent='Chưa có số liệu cho kỳ này – nhập mới.';
    }).catch(function(e){if(my===token){banner.textContent=errMsg(e);banner.className='hint err'}});
  }
  thang.addEventListener('change',lay);xa.addEventListener('change',lay);dt.addEventListener('change',lay);
  function save(){
    msg.innerHTML='';
    if(!xa.value){alert('Vui lòng chọn xã.');return}
    var f={};
    Array.prototype.forEach.call(fieldBox.querySelectorAll('[data-k]'),function(i){f[i.getAttribute('data-k')]=i.value});
    btn.disabled=true;btn.textContent='Đang lưu…';
    call('SLT_LUU',{thang:thang.value,xa:xa.value,dt:dt.value,f:f,gc:gc.value,nguoi:nguoi}).then(function(r){
      btn.disabled=false;btn.textContent='Lưu số liệu';
      if(r&&r.ok)msg.appendChild(el('div',{class:'ok'},[el('b',{text:r.capNhat?'Đã cập nhật số liệu.':'Đã lưu số liệu mới.'}),
        el('p',{},[el('button',{class:'s',text:'Xem danh sách',onclick:function(){sltRender('ds')}})])]));
      else msg.appendChild(el('div',{class:'bad',text:(r&&r.message)||'Không lưu được.'}));
    }).catch(function(e){btn.disabled=false;btn.textContent='Lưu số liệu';msg.appendChild(el('div',{class:'bad',text:errMsg(e)}))});
  }
  [el('div',{class:'card'},[
    el('label',{class:'l',text:'Tháng'}),thang,
    el('label',{class:'l',text:'Xã (địa bàn)'}),xa,
    el('label',{class:'l',text:'Đối tượng'}),dt,banner,fieldBox,
    el('label',{class:'l',text:'Ghi chú'}),gc]),
   el('div',{class:'card'},[btn,msg])].forEach(function(n){body.appendChild(n)});
  lay();
}
function sltList(body){
  var thang=el('input',{type:'month',value:SLTCFG.thangHienTai}),tatCa=null,nguoi=null,list=el('div',{});
  var ctr=[el('label',{class:'l',text:'Tháng'}),thang];
  if(SLTCFG.xemTatCa){
    tatCa=el('select',{},[el('option',{value:'',text:'Chỉ của tôi'}),el('option',{value:'1',text:'Tất cả cán bộ'})]);
    ctr.push(el('label',{class:'l',text:'Phạm vi'}),tatCa);
  }
  ctr.push(el('p',{},[el('button',{class:'p',text:'Xem',onclick:load})]));
  body.appendChild(el('div',{class:'card'},ctr));body.appendChild(list);
  function load(){
    list.innerHTML='';list.appendChild(msgCard('Đang tải…'));
    callView('SLT_DS',{thang:thang.value,tatCa:tatCa?!!tatCa.value:false}).then(function(r){
      list.innerHTML='';
      if(!r||!r.ok){list.appendChild(msgCard((r&&r.message)||'Lỗi',true));return}
      list.appendChild(el('p',{class:'mut',text:r.tong+' dòng số liệu'}));
      if(!r.ds.length)list.appendChild(el('div',{class:'card mut',text:'Chưa có số liệu nào trong tháng này.'}));
      r.ds.forEach(function(e){
        var kids=[el('div',{class:'top'},[el('div',{class:'hd',text:e.xa+(e.dt?' – '+e.dt:' – số liệu chung')}),el('div',{class:'mut',text:e.thang})]),
          el('div',{class:'mut',text:'Người theo dõi: '+e.nguoi})];
        if(e.tomTat)kids.push(el('div',{text:e.tomTat}));
        if(e.gc)kids.push(el('div',{class:'mut',text:e.gc}));
        if(e.sua){
          kids.push(el('div',{class:'btns'},[
            el('button',{class:'s',text:'Sửa',onclick:function(){sltRender('nhap',{thang:e.thang,xa:e.xa,dt:e.dt,nguoi:e.nguoi})}}),
            el('button',{class:'d',text:'Xóa',onclick:function(){
              if(!confirm('Xóa dòng số liệu này?'))return;
              call('SLT_XOA',{thang:e.thang,xa:e.xa,dt:e.dt,nguoi:e.nguoi}).then(function(x){if(x&&x.ok)load();else alert((x&&x.message)||'Không xóa được.')}).catch(function(er){alert(errMsg(er))});
            }})]));
        }
        list.appendChild(el('div',{class:'item'},kids));
      });
    }).catch(function(e){list.innerHTML='';list.appendChild(msgCard('Lỗi: '+errMsg(e),true))});
  }
  load();
}
function canhBaoText(cb){return cb.map(function(t){return t.ten+' – '+fmtVN(t.ngay)+' – '+t.buoi+' – '+t.hd}).join('; ')}
function warnBox(msg,cb){
  if(!cb||!cb.length)return;
  var kids=[el('b',{text:'Lưu ý: trùng với lịch nghỉ / nhật ký khác (vẫn đã lưu).'})];
  cb.forEach(function(t){kids.push(el('div',{text:'• '+t.ten+' – '+fmtVN(t.ngay)+' – '+t.buoi+' – '+t.hd}))});
  msg.appendChild(el('div',{class:'warn'},kids));
}

/* ---------- LỊCH CÔNG TÁC ---------- */
var LICH={thang:null,pham:'toi',chon:0,nguoi:''};
function pad(n){return ('0'+n).slice(-2)}
function lichHome(){
  if(!LICH.thang){var d=new Date();LICH.thang=d.getFullYear()+'-'+pad(d.getMonth()+1)}
  lichLoad();
}
function lichLoad(){
  show([msgCard('Đang tải lịch…')],boot);
  var go=function(){
    callView('LICH_THANG',{thang:LICH.thang,pham:LICH.pham}).then(function(r){
      if(!r||!r.ok){show([msgCard((r&&r.message)||'Lỗi',true,[retry(lichLoad)])],boot);return}
      lichRender(r);
    }).catch(function(e){show([msgCard('Lỗi: '+errMsg(e),true,[retry(lichLoad)])],boot)});
  };
  go();
}
function lichShift(delta){
  var p=LICH.thang.split('-'),d=new Date(+p[0],+p[1]-1+delta,1);
  LICH.thang=d.getFullYear()+'-'+pad(d.getMonth()+1);LICH.chon=0;lichLoad();
}
function lichCodes(txt){
  var bad=/!$/.test(txt),t=txt.replace(/!$/,''),codes=[];
  (t?t.split(/[\/+]/):[]).forEach(function(c){if(codes.indexOf(c)<0)codes.push(c)});
  return {bad:bad,codes:codes};
}
function lichRender(r){
  var nghi={};r.chuThich.forEach(function(x){if(x.nghi)nghi[x.code]=true});
  var prev=el('button',{class:'s',text:'‹',onclick:function(){lichShift(-1)}}),next=el('button',{class:'s',text:'›',onclick:function(){lichShift(1)}});
  var mi=el('input',{type:'month',value:r.thang});
  mi.addEventListener('change',function(){if(mi.value){LICH.thang=mi.value;LICH.chon=0;lichLoad()}});
  var hn=el('button',{class:'s',text:'Tháng hiện tại',onclick:function(){LICH.thang=r.homNay.slice(0,7);LICH.chon=0;lichLoad()}});
  var tabs=el('div',{class:'tabs'},[
    el('button',{class:LICH.pham==='toi'?'on':'',text:'Của tôi',onclick:function(){LICH.pham='toi';LICH.chon=0;lichLoad()}}),
    el('button',{class:LICH.pham==='hat'?'on':'',text:'Cả hạt',onclick:function(){LICH.pham='hat';LICH.chon=0;lichLoad()}})]);
  var legend=el('div',{class:'mut'},r.chuThich.map(function(x){return el('span',{class:'cd'+(x.nghi?' nghi':''),text:x.code+' = '+x.name+(x.ghep?' (ghép được)':'')})}));
  var head=el('div',{class:'card'},[el('div',{class:'lnav'},[prev,mi,next]),el('p',{},[hn,' ',el('button',{class:'p',text:'Đăng ký nghỉ',onclick:function(){lichNghi('')}})]),tabs]);
  var body=r.nguoi?lichHat(r,nghi):lichToi(r,nghi);
  show([head,body,el('div',{class:'card'},[el('div',{class:'hint',text:'Bảng mã:'}),legend,
    el('div',{class:'hint',text:'Một buổi có thể có nhiều mã (nối bằng dấu +) nếu hoạt động được đánh dấu "ghép được". Ô đỏ / dấu !: hai việc không ghép được trùng buổi. Nhật ký trùng lịch nghỉ chỉ cảnh báo.'})])],boot);
}
/* một dòng hoạt động trong phần chi tiết ngày, kèm nút sửa / xóa nếu có quyền */
function lichItem(x,r){
  var kids=[el('div',{class:'top'},[el('div',{class:'hd',text:x.hd+' ('+x.code+')'}),el('div',{class:'mut',text:fmtVN(x.ngay)+' · '+x.buoi})])];
  kids.push(el('div',{class:'mut',text:'Người nhập: '+x.nhap+(x.cung.length?' · Cùng: '+x.cung.join(', '):'')}));
  if(x.tomTat)kids.push(el('div',{text:x.tomTat}));
  if(x.nd)kids.push(el('div',{class:'mut',text:x.nd}));
  if(x.dd)kids.push(el('div',{class:'mut',text:'📍 '+x.dd}));
  if(x.trung==='chan')kids.push(el('div',{class:'err',text:'Trùng buổi với việc không ghép được'}));
  else if(x.trung==='canh')kids.push(el('div',{class:'mut',text:x.nghi?'Trùng với nhật ký công việc':'Trùng với lịch nghỉ'}));
  if(x.sua)kids.push(el('div',{class:'btns'},[
    el('button',{class:'s',text:'Sửa',onclick:function(){if(x.nghi)lichNghi('',x);else nkHome('ghi',x)}}),
    el('button',{class:'d',text:x.nghi?'Hủy đăng ký':'Xóa',onclick:function(){
      if(!confirm((x.nghi?'Hủy đăng ký ':'Xóa nhật ký ')+x.hd+' ngày '+fmtVN(x.ngay)+' ('+x.buoi+')'+(x.nhap!==r.ten?' của '+x.nhap:'')+'?'))return;
      call('NK_XOA',{ma:x.ma}).then(function(q){if(q&&q.ok)lichLoad();else alert((q&&q.message)||'Không xóa được.')}).catch(function(e){alert(errMsg(e))});
    }})]));
  return el('div',{class:'item'+(x.nghi?' st-doing':'')},kids);
}
function lichToi(r,nghi){
  var wrap=el('div',{class:'card'}),tb=el('table',{class:'lcal'}),tr=el('tr',{});
  ['T2','T3','T4','T5','T6','T7','CN'].forEach(function(x){tr.appendChild(el('th',{text:x}))});tb.appendChild(tr);
  var off=(r.thuDau+6)%7,d=1,detail=el('div',{});
  for(var w=0;w<6&&d<=r.soNgay;w++){
    var row=el('tr',{});
    for(var k=0;k<7;k++){
      if((w===0&&k<off)||d>r.soNgay){row.appendChild(el('td',{style:'background:#f7f9f8;cursor:default'}));continue}
      (function(day,col){
        var ds=r.thang+'-'+pad(day),c=lichCodes(r.o[day-1]);
        var cls=(col>=5?'we ':'')+(c.bad?'tr ':'')+(ds===r.homNay?'hn ':'')+(LICH.chon===day?'sl':'');
        var kids=[el('div',{class:'n',text:String(day)})];

/* ---------- HOẠT ĐỘNG CHUYÊN MÔN ---------- */
var CM={thang:null,ten:'',ngay:0};
function cmHome(){
  if(!CM.thang){var d=new Date();CM.thang=d.getFullYear()+'-'+pad(d.getMonth()+1)}
  cmLoad();
}
function cmShift(delta){var p=CM.thang.split('-'),d=new Date(+p[0],+p[1]-1+delta,1);CM.thang=d.getFullYear()+'-'+pad(d.getMonth()+1);CM.ngay=0;cmLoad()}
function cmLoad(){
  show([msgCard('Đang tải…')],boot);
  callView('CM_LAY',{thang:CM.thang}).then(function(r){
    if(!r||!r.ok){show([msgCard((r&&r.message)||'Lỗi',true,[retry(cmLoad)])],boot);return}
    cmRender(r);
  }).catch(function(e){show([msgCard('Lỗi: '+errMsg(e),true,[retry(cmLoad)])],boot)});
}
function cmItem(x,r){
  var kids=[el('div',{class:'top'},[el('div',{class:'hd',text:x.nd}),el('div',{class:'mut',text:fmtVN(x.ngay)+' · '+x.buoi})]),
    el('div',{class:'mut',text:'Người đăng ký: '+x.nhap+(x.cung.length?' · Cùng: '+x.cung.join(', '):'')})];
  if(x.sua)kids.push(el('div',{class:'btns'},[
    el('button',{class:'s',text:'Sửa',onclick:function(){cmForm(r,x)}}),
    el('button',{class:'d',text:'Xóa',onclick:function(){
      if(!confirm('Xóa hoạt động "'+x.nd+'" ngày '+fmtVN(x.ngay)+' ('+x.buoi+')?'))return;
      call('CM_XOA',{ma:x.ma}).then(function(q){if(q&&q.ok)cmLoad();else alert((q&&q.message)||'Không xóa được.')}).catch(function(e){alert(errMsg(e))});
    }})]));
  else kids.push(el('div',{class:'hint',text:'Chỉ '+x.nhap+' (người đăng ký) hoặc quản trị mới sửa/xóa được.'}));
  return el('div',{class:'item'},kids);
}
function cmRender(r){
  var prev=el('button',{class:'s',text:'‹',onclick:function(){cmShift(-1)}}),next=el('button',{class:'s',text:'›',onclick:function(){cmShift(1)}});
  var mi=el('input',{type:'month',value:r.thang});
  mi.addEventListener('change',function(){if(mi.value){CM.thang=mi.value;CM.ngay=0;cmLoad()}});
  var nodes=[el('div',{class:'card'},[el('div',{class:'lnav'},[prev,mi,next]),
    el('p',{},[el('button',{class:'p',text:'Đăng ký hoạt động chuyên môn',onclick:function(){cmForm(r,null,{})}})]),
    r.canhBao?el('div',{class:'hint',text:r.canhBao}):null])];
  var tb=el('table',{class:'hat cmt'}),h1=el('tr',{}),h2=el('tr',{}),wd=['CN','T2','T3','T4','T5','T6','T7'];
  h1.appendChild(el('th',{class:'nm',text:'Cán bộ'}));h2.appendChild(el('th',{class:'nm',text:''}));
  for(var d=1;d<=r.soNgay;d++){var dow=(r.thuDau+d-1)%7,we=dow===0||dow===6;h1.appendChild(el('th',{class:we?'we':'',text:String(d)}));h2.appendChild(el('th',{class:we?'we':'',text:wd[dow]}))}
  tb.appendChild(h1);tb.appendChild(h2);
  r.nguoi.forEach(function(p){var row=el('tr',{class:p.ten===r.ten?'me':''});row.appendChild(el('td',{class:'nm',text:p.ten}));
    p.o.forEach(function(t,i){var dow=(r.thuDau+i)%7,on=CM.ten===p.ten&&CM.ngay===i+1;
      row.appendChild(el('td',{class:((dow===0||dow===6)?'we ':'')+(on?'on':''),title:t,text:t,onclick:function(){CM.ten=p.ten;CM.ngay=i+1;cmRender(r)}}))});
    tb.appendChild(row)});
  nodes.push(el('div',{class:'hatw'},[tb]));
  if(CM.ngay&&CM.ten){
    var ds=r.thang+'-'+pad(CM.ngay),ten=CM.ten;
    var items=r.muc.filter(function(x){return x.ngay===ds&&x.ds.indexOf(ten)>=0});
    var det=[el('div',{class:'gt',text:ten+' – ngày '+fmtVN(ds)})];
    if(!items.length)det.push(el('div',{class:'mut',text:'Chưa có hoạt động chuyên môn.'}));
    items.forEach(function(x){det.push(cmItem(x,r))});
    det.push(el('p',{},[el('button',{class:'s',text:'Đăng ký ngày này',onclick:function(){cmForm(r,null,{ngay:ds,nhap:r.quanTri?ten:'',cung:!r.quanTri&&ten!==r.ten?[ten]:[]})}})]));
    nodes.push(el('div',{class:'card'},det));
  }else nodes.push(el('div',{class:'hint',text:'Chạm vào một ô để xem chi tiết, sửa hoặc xóa. Mỗi người mỗi buổi chỉ có một hoạt động chuyên môn; buổi đã có người đăng ký thì chỉ người đăng ký đầu tiên (hoặc quản trị) sửa được.'}));
  show(nodes,boot);
}
function cmForm(r,edit,preset){
  preset=preset||{};
  var sel={};if(edit)sel[edit.ngay]=true;else if(preset.ngay)sel[preset.ngay]=true;
  var selBox=el('div',{class:'sels'}),msg=el('div',{}),buoi=edit?edit.buoi:'Cả ngày';
  function drawSels(){selBox.innerHTML='';var ks=Object.keys(sel).sort();
    if(!ks.length){selBox.appendChild(el('span',{class:'mut',text:edit?'Chọn ngày.':'Chạm vào các ngày (có thể chọn nhiều ngày).'}));return}
    ks.forEach(function(k){selBox.appendChild(el('span',{class:'chip',text:fmtVN(k)}))})}
  var cal=makeCal({homNay:r.homNay,minNgay:'',maxNgay:r.maxNgay},sel,drawSels,!!edit);drawSels();
  var seg=el('div',{class:'seg'});
  r.buoi.slice().reverse().forEach(function(b){
    var lb=el('label',{class:b===buoi?'on':''},[el('span',{text:b})]);
    lb.addEventListener('click',function(){buoi=b;Array.prototype.forEach.call(seg.children,function(x){x.className=''});lb.className='on'});
    seg.appendChild(lb);
  });
  var nd=el('input',{type:'text',maxlength:String(r.maxLen),placeholder:'Nội dung ngắn (tối đa '+r.maxLen+' ký tự)'});if(edit)nd.value=edit.nd;
  var dem=el('div',{class:'hint'});var upd=function(){dem.textContent=nd.value.length+' / '+r.maxLen+' ký tự'};nd.addEventListener('input',upd);upd();
  var owner=null;
  if(r.quanTri){owner=el('select',{},r.nguoi.map(function(p){return el('option',{value:p.ten,text:p.ten})}));owner.value=edit?edit.nhap:(preset.nhap||r.ten)}
  var chosen={};(edit?edit.cung:(preset.cung||[])).forEach(function(n){chosen[n]=true});
  var pk=makePick(r.nguoi.map(function(p){return {ten:p.ten,dia:p.dia}}),chosen,false);
  var lbl=edit?'Lưu thay đổi':'Đăng ký';
  var btn=el('button',{class:'p',text:lbl,onclick:function(){
    var ks=Object.keys(sel).sort();
    if(!ks.length){alert('Vui lòng chọn ngày.');return}
    if(!nd.value.trim()){alert('Vui lòng nhập nội dung.');return}
    var p={ngay:ks,buoi:buoi,cung:Object.keys(chosen),nd:nd.value};
    if(edit)p.ma=edit.ma;if(owner)p.nhap=owner.value;
    msg.innerHTML='';btn.disabled=true;btn.textContent='Đang lưu…';
    call('CM_LUU',p).then(function(x){
      btn.disabled=false;btn.textContent=lbl;
      if(x&&x.ok&&x.offline){msg.appendChild(el('div',{class:'ok'},[el('b',{text:'Đang mất mạng: đã lưu trên máy, sẽ tự gửi khi có mạng.'}),el('p',{},[el('button',{class:'s',text:'Về lịch chuyên môn',onclick:cmLoad})])]));return}
      if(x&&x.ok){CM.thang=ks[0].slice(0,7);cmLoad();return}
      if(x&&x.loai==='TRUNG'){
        var kids=[el('b',{text:x.message})];
        x.trung.forEach(function(t){kids.push(el('div',{text:'• '+t.ten+' – '+fmtVN(t.ngay)+' – '+t.buoi+' – "'+t.hd+'" (người đăng ký: '+t.nhap+')'}))});
        msg.appendChild(el('div',{class:'bad'},kids));
      }else msg.appendChild(el('div',{class:'bad',text:(x&&x.message)||'Không lưu được.'}));
    }).catch(function(e){btn.disabled=false;btn.textContent=lbl;msg.appendChild(el('div',{class:'bad',text:errMsg(e)}))});
  }});
  var nodes=[el('p',{class:'hello',text:edit?'Sửa hoạt động chuyên môn':'Đăng ký hoạt động chuyên môn'})];
  if(owner)nodes.push(el('label',{class:'l',text:'Người đăng ký (quản trị chọn được người khác)'}),owner);
  nodes.push(el('label',{class:'l'},['Nội dung ',el('i',{text:'*'})]),nd,dem,
    el('label',{class:'l'},[edit?'Ngày ':'Ngày (chọn một hoặc nhiều ngày) ',el('i',{text:'*'})]),cal,selBox,
    el('label',{class:'l',text:'Buổi'}),seg,
    el('label',{class:'l'},[el('span',{text:'Cán bộ tham gia cùng'}),el('span',{class:'mut',text:'  (không cần chọn người đăng ký)'})]),pk.search,pk.box);
  show([el('div',{class:'card'},nodes),el('div',{class:'card'},[btn,msg])],cmLoad);
}

}

      if(x&&x.ok){r.nam=x.nam;nmsg.appendChild(el('div',{class:'ok',text:'Đã đổi năm sử dụng sang '+x.nam+'.'+(x.canhBao?' Lưu ý: '+x.canhBao:'')}))}

  }});
  var yc=el('div',{class:'card'},[el('div',{class:'gt',text:'Năm sử dụng chung cho các bảng tháng'}),
    el('div',{class:'mut',text:'Đang dùng: năm '+(r.nam||'(chưa đặt)')+'. Thường chỉ đổi khi sang năm mới.'}),
    el('div',{class:'lnav',style:'margin-top:8px'},[namIn,nb]),nmsg]);
  /* khóa chức năng với người dùng */
  var kh=r.khoa||{},kmsg=el('div',{}),dongKh=[];
  var khBox=el('div',{});
  (r.dsCn||[]).forEach(function(c){
    var x=el('input',{type:'checkbox'});x.style.width='auto';x.checked=!!kh[c.ma];
    var ld=el('input',{type:'text',placeholder:'Lý do / thông báo cho người dùng (không bắt buộc)',value:(kh[c.ma]&&kh[c.ma].lyDo)||''});
    var ldBox=el('div',{style:'margin:4px 0 0 30px'},[ld]);
    var sync=function(){ldBox.style.display=x.checked?'':'none'};x.addEventListener('change',sync);sync();
    dongKh.push({ma:c.ma,x:x,ld:ld});
    khBox.appendChild(el('div',{style:'margin-top:10px'},[el('label',{style:'display:flex;gap:10px;align-items:center'},[x,el('span',{text:'🔒 Khóa "'+c.ten+'"'})]),ldBox,
      kh[c.ma]?el('div',{class:'mut',style:'margin-left:30px;font-size:12px',text:'Khóa từ '+fmtVN(kh[c.ma].ngay)+(kh[c.ma].boi?' – '+kh[c.ma].boi:'')}):null]));
  });
  var kb=el('button',{class:'p',text:'Lưu khóa chức năng',onclick:function(){
    var ds=dongKh.filter(function(d){return d.x.checked}),lyDo={};
    ds.forEach(function(d){lyDo[d.ma]=d.ld.value.trim()});
    kb.disabled=true;kmsg.innerHTML='';
    call('QT_KHOA',{khoa:ds.map(function(d){return d.ma}),lyDo:lyDo}).then(function(x){kb.disabled=false;
      if(x&&x.ok){r.khoa=x.khoa;ME.khoa=x.khoa;try{cset(ckey('v','ME',{}),ME)}catch(e){}
        kmsg.appendChild(el('div',{class:'ok',text:ds.length?('Đã khóa: '+ds.map(function(d){return (r.dsCn.filter(function(c){return c.ma===d.ma})[0]||{}).ten}).join(', ')+'. Người dùng sẽ thấy khi mở lại ứng dụng.'):'Đã mở khóa tất cả chức năng.'}))}
      else kmsg.appendChild(el('div',{class:'bad',text:(x&&x.message)||'Không lưu được.'}));
    }).catch(function(e){kb.disabled=false;kmsg.appendChild(el('div',{class:'bad',text:errMsg(e)}))});
  }});
  var khCard=r.dsCn?el('div',{class:'card'},[el('div',{class:'gt',text:'Khóa chức năng'}),
    el('div',{class:'hint',text:'Chức năng bị khóa: người dùng không vào được, không ghi hay sửa dữ liệu được. Quản trị vẫn dùng bình thường. Khi khóa Nhật ký, người dùng vẫn đăng ký nghỉ ở Lịch công tác và vẫn báo hoàn thành nhiệm vụ (không kèm nhật ký).'}),
    khBox,el('p',{},[kb]),kmsg]):null;
  var search=el('input',{type:'text',placeholder:'Tìm cán bộ…'}),list=el('div',{});
  function draw(){
    list.innerHTML='';var q=search.value.toLowerCase();
    r.nguoi.filter(function(u){return u.ten.toLowerCase().indexOf(q)>=0}).forEach(function(u){
      var chips=[el('span',{class:'chip'+(u.nhom==='Quản trị hệ thống'?' st-bad':u.nhom==='Giao việc'?' st-late':''),text:u.nhom})];
      if(u.vai)chips.push(el('span',{class:'chip',text:u.vai}));
      if(u.dia)chips.push(el('span',{class:'chip',text:'Địa bàn: '+u.dia}));
      if(u.kiem)chips.push(el('span',{class:'chip',text:'Kiêm địa bàn'}));
      if(!u.hoatDong)chips.push(el('span',{class:'chip x',text:'Không hoạt động'}));
      list.appendChild(el('div',{class:'item'+(u.hoatDong?'':' st-bad')},[el('div',{class:'top'},[el('div',{class:'hd',text:u.ten}),
        el('button',{class:'s',style:'padding:6px 12px',text:'Sửa',onclick:function(){qtForm(r,u)}})]),
        el('div',{},chips),el('div',{class:'mut',text:u.email?'Email: '+u.email:'Chưa liên kết email'})]));
    });
  }
  search.addEventListener('input',draw);draw();
  show([khCard,yc,el('div',{class:'card'},[el('div',{class:'gt',text:'Cán bộ ('+r.nguoi.length+')'}),
    el('div',{class:'hint',text:'Muốn thêm cán bộ mới hoặc đổi họ tên: sửa trực tiếp sheet NGUOI_DUNG (thêm vào dòng trống cuối). Thay đổi quyền có hiệu lực khi người đó mở lại trang.'}),search]),list],boot);
}
function qtForm(r,u){
  var sel=function(opts,val,blank){var s=el('select',{},(blank?[el('option',{value:'',text:blank})]:[]).concat(opts.map(function(o){return el('option',{value:o,text:o})})));
    if(val&&opts.indexOf(val)<0)s.appendChild(el('option',{value:val,text:val+' (không có trong danh mục)'}));s.value=val||'';return s};
  var nhom=sel(r.nhom,u.nhom),vai=sel(r.vaiTro,u.vai,'(trống)'),dia=sel(r.xa,u.dia,'(không phụ trách xã)');
  var cb=function(v){var x=el('input',{type:'checkbox'});x.checked=!!v;x.style.width='auto';return x};
  var kiem=cb(u.kiem),hd=cb(u.hoatDong),xe=cb(false),msg=el('div',{});
  var row=function(x,t){return el('label',{style:'display:flex;gap:10px;align-items:center;margin-top:12px'},[x,el('span',{text:t})])};
  var btn=el('button',{class:'p',text:'Lưu thay đổi',onclick:function(){
    if(xe.checked&&!confirm('Gỡ email '+u.email+' khỏi '+u.ten+'? Người này sẽ phải gửi yêu cầu liên kết lại.'))return;
    btn.disabled=true;msg.innerHTML='';
    call('QT_SUA_NGUOI',{row:u.row,ten:u.ten,nhom:nhom.value,vai:vai.value,dia:dia.value,kiem:kiem.checked,hoatDong:hd.checked,xoaEmail:xe.checked}).then(function(x){
      btn.disabled=false;
      if(x&&x.ok){if(u.ten===ME.user.ten)alert('Đã lưu. Quyền của chính bạn có hiệu lực khi mở lại trang.');qtView()}
      else msg.appendChild(el('div',{class:'bad',text:(x&&x.message)||'Không lưu được.'}));
    }).catch(function(e){btn.disabled=false;msg.appendChild(el('div',{class:'bad',text:errMsg(e)}))});
  }});
  var nodes=[el('p',{class:'hello',text:u.ten}),
    el('label',{class:'l',text:'Nhóm quyền'}),nhom,
    el('div',{class:'hint',text:'Quản trị hệ thống: toàn quyền · Giao việc: xem tất cả và giao việc · Nhập liệu: ghi dữ liệu của mình.'}),
    el('label',{class:'l',text:'Vai trò'}),vai,
    el('label',{class:'l',text:'Địa bàn phụ trách'}),dia,
    row(kiem,'Kiêm địa bàn'),row(hd,'Đang hoạt động (bỏ chọn để khóa tài khoản)')];
  if(u.email)nodes.push(row(xe,'Gỡ email liên kết ('+u.email+')'));
  show([el('div',{class:'card'},nodes),el('div',{class:'card'},[btn,msg])],qtView);
}

/* ---------- DỌN DỮ LIỆU (quản trị) ---------- */
function donView(){
  var mk=function(title,desc,action){
    var msg=el('div',{});
    var b=el('button',{class:'p',text:'Dồn dòng & đánh lại mã',onclick:function(){
      if(!confirm(title+': dồn các dòng lên trên, sắp theo ngày và đánh lại mã từ 0001?\nNên làm khi ít người đang dùng. Mã cũ sẽ thay đổi.'))return;
      b.disabled=true;msg.innerHTML='';msg.appendChild(el('div',{class:'mut',text:'Đang xử lý…'}));
      call(action).then(function(r){b.disabled=false;msg.innerHTML='';
        msg.appendChild(el('div',{class:r&&r.ok?'ok':'bad',text:r&&r.ok?('Xong: '+r.soDong+' dòng dữ liệu, đã bỏ '+r.soTrong+' dòng trống.'):((r&&r.message)||'Lỗi')}));
      }).catch(function(e){b.disabled=false;msg.innerHTML='';msg.appendChild(el('div',{class:'bad',text:errMsg(e)}))});
    }});
    return el('div',{class:'card'},[el('div',{class:'gt',text:title}),el('p',{class:'mut',text:desc}),b,msg]);
  };
  show([msgCard('Ghi mới đã tự lấp vào các dòng trống. Chức năng dưới đây dùng định kỳ (ví dụ cuối tháng) để sắp xếp gọn sheet. Nên đặt tên phiên bản file (File → Lịch sử phiên bản) trước khi chạy.'),
    mk('Nhật ký công tác (NHAT_KY)','Sắp xếp theo ngày, buổi; mã mới NK-0001, NK-0002…','NK_DONDONG'),
    mk('Nhiệm vụ (NHIEM_VU_GIAO)','Sắp xếp theo ngày giao; mã mới NV-0001, NV-0002…','NV_DONDONG')],boot);
}
boot();
</script>
