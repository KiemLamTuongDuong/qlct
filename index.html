<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hệ thống quản lý công tác – Hạt Kiểm lâm Tương Dương</title>
<meta name="theme-color" content="#1f5c3a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="config.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root{--g:#1f5c3a;--g2:#2e7d4f;--bg:#f3f6f4;--tx:#1d2b24;--mut:#6b7a72;--line:#dfe6e2;--red:#c0392b;--sel:#2e7d4f}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--tx);font-size:17px;line-height:1.4}
header{background:var(--g);color:#fff;padding:8px 12px;position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px}
header .logo{height:46px;width:auto;flex:none}
header .phai{min-width:34px;display:flex;gap:6px;justify-content:flex-end;align-items:center;flex:none}
header h1{margin:0;font-size:clamp(12px,3.75vw,21px);flex:1;min-width:0;text-align:center;line-height:1.25}
header h1 #donvi{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header small{opacity:.9;display:block;font-weight:normal;font-size:clamp(12px,3.5vw,15px)}
header .back{cursor:pointer;font-size:28px;padding:0 10px 0 2px;line-height:1}
main{max-width:820px;margin:0 auto;padding:14px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px}
.hello{font-size:21px;font-weight:bold;margin:0 0 8px}
.chip{display:inline-block;background:#e6f2ea;color:var(--g);border-radius:20px;padding:5px 12px;font-size:15px;margin:2px 4px 2px 0}
.chip.x{background:#fdecea;color:var(--red)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:620px){.grid{grid-template-columns:repeat(3,1fr)}}
.tile{background:#fff;border:1px solid var(--line);border-top:4px solid var(--g2);border-radius:12px;padding:14px 10px;text-align:center;cursor:pointer;min-height:96px;position:relative}
.tile .ic{font-size:26px}.tile .t{font-weight:bold;margin-top:6px;font-size:14px}.tile .s{color:var(--mut);font-size:12px;margin-top:2px}
.tile.off{opacity:.55;cursor:default;border-top-color:#b5bfba}
/* trang chủ: 6 ô lớn chia đều màn hình điện thoại */
html.dt-gia main.home{min-height:calc(var(--hthat) - 66px)}
html.dt-gia header h1{font-size:15.5px}
html.dt-gia header small{font-size:13.5px}
main.home{display:flex;flex-direction:column;min-height:calc(100vh - 66px);min-height:calc(100svh - 66px);box-sizing:border-box}
main.home .chao{padding:10px 14px;margin-bottom:10px}
main.home .chao .chip{font-size:13px;padding:3px 9px;margin:1px 3px 1px 0}
main.home .chao .mut{font-size:14px}
main.home .chao .hello{font-size:20px;margin:0 0 4px}
/* trang chủ: mọi ô bằng nhau; số hàng/cột tính theo số ô (--h2/--h3/--h4 do home() đặt); vừa màn hình thì chia đều, không vừa thì cuộn */
.grid.gh{flex:1;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(var(--h2,3),minmax(112px,1fr));gap:10px}
@media(min-width:620px){.grid.gh{grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(var(--h3,2),minmax(140px,1fr))}}
@media(min-width:900px) and (orientation:landscape) and (pointer:fine){.grid.gh.nhieu{grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:repeat(var(--h4,2),minmax(150px,1fr))}}
.grid.gh .tile{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:0;min-width:0;padding:8px 6px;border-top-width:6px;overflow:hidden}
.grid.gh .tile .ic{font-size:44px;line-height:1.05}
.grid.gh .tile .t{font-size:18px;line-height:1.2;margin-top:6px}
.grid.gh .tile .s{font-size:13px;line-height:1.25;margin-top:3px}
@supports (container-type:size){
  .grid.gh .tile{container-type:size}
  .grid.gh .tile .ic{font-size:clamp(28px,36cqmin,74px)}
  .grid.gh .tile .t{font-size:clamp(14px,min(10cqw,13cqh),24px)}
  .grid.gh .tile .s{font-size:clamp(12px,min(7cqw,8.5cqh),15px)}
  @container (max-height:128px){.grid.gh .tile .s{display:none}}
}
.grid.gh .badge{font-size:15px;padding:2px 10px;top:10px;right:12px}
.cochu{display:inline-flex;gap:4px;align-items:center}
.cochu span{border:1px solid var(--line);border-radius:8px;padding:2px 9px;cursor:pointer;font-weight:bold;color:var(--g)}
.cochu span.on{background:var(--g);color:#fff;border-color:var(--g)}
.badge{position:absolute;top:8px;right:10px;background:var(--red);color:#fff;border-radius:12px;font-size:12px;padding:1px 8px}
button,select,input,textarea{font:inherit;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--tx)}
button{cursor:pointer}
button.p{background:var(--g2);color:#fff;border-color:var(--g2)}
button.d{background:#fff;color:var(--red);border-color:var(--red)}
button.s{background:#fff;color:var(--g2);border-color:var(--g2)}
button:disabled{opacity:.5}
select,input[type=text],input[type=number],input[type=month],textarea{width:100%}
label.l{display:block;font-weight:bold;font-size:16px;margin:14px 0 5px;color:#33443b}
label.l i{color:var(--red);font-style:normal}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding:10px 0}
.row:last-child{border-bottom:none}
.mut{color:var(--mut);font-size:15px}.err{color:var(--red)}
.link{color:var(--g2);cursor:pointer;text-decoration:underline}
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tabs button{flex:1}.tabs button.on{background:var(--g2);color:#fff;border-color:var(--g2)}
.seg{display:flex;gap:6px}.seg label{flex:1;text-align:center;border:1px solid var(--line);border-radius:8px;padding:9px 4px;cursor:pointer;background:#fff}
.seg input{display:none}.seg input:checked+span{font-weight:bold;color:#fff}
.seg label.on{background:var(--sel);color:#fff;border-color:var(--sel)}
.cal{border:1px solid var(--line);border-radius:10px;padding:8px;background:#fff}
.cal .h{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.cal .h button{padding:4px 12px}
.cal table{width:100%;border-collapse:collapse;table-layout:fixed}
.cal th{font-size:14px;color:var(--mut);padding:3px 0}
.cal td{text-align:center;padding:2px}
.cal td div{padding:10px 0;border-radius:8px;cursor:pointer;font-size:17px}
.cal td div.today{border:1px solid var(--g2)}
.cal td div.sel{background:var(--sel);color:#fff;font-weight:bold}
.cal td div.dis{color:#c4cbc7;cursor:default}
.sels{margin-top:6px}
.pick{max-height:220px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:4px 10px;background:#fff}
.pick label{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #f0f3f1;cursor:pointer}
.pick label:last-child{border-bottom:none}
.pick input{width:20px;height:20px;padding:0}
.item{border:1px solid var(--line);border-left:5px solid var(--g2);border-radius:10px;padding:10px 12px;margin-bottom:10px;background:#fff}
.item .top{display:flex;justify-content:space-between;gap:8px}
.item .hd{font-weight:bold}
.item .btns{margin-top:8px;display:flex;gap:8px}
.item .btns button{padding:6px 12px}
.ok{background:#e6f2ea;border:1px solid #b9dcc6;border-radius:10px;padding:12px;margin-top:12px}
.bad{background:#fdecea;border:1px solid #f1b9b2;border-radius:10px;padding:12px;margin-top:12px;color:#7d261c}
.item.st-ok{border-left-color:#2e7d4f}.item.st-late{border-left-color:#b8860b}.item.st-bad{border-left-color:#c0392b}.item.st-doing{border-left-color:#3b7f9e}
.chip.st-ok{background:#e6f2ea;color:#1f5c3a}.chip.st-late{background:#fff3d6;color:#8a6a00}.chip.st-bad{background:#fdecea;color:#c0392b}.chip.st-doing{background:#e3f0f7;color:#1f5a7a}
.hint{color:var(--mut);font-size:14px;margin:4px 0}
.gt{font-weight:bold;color:var(--g);margin:16px 0 2px;padding-bottom:4px;border-bottom:2px solid #e6f2ea}
.warn{background:#fff3d6;border:1px solid #f0d58a;border-radius:10px;padding:12px;margin-top:12px;color:#7a5a00}
.lnav{display:flex;gap:6px;align-items:center}.lnav input{flex:1;text-align:center}.lnav button{padding:9px 14px}
.lcal{width:100%;border-collapse:collapse;table-layout:fixed}
.lcal th{font-size:12px;color:var(--mut);padding:4px 0}
.lcal td{border:1px solid var(--line);vertical-align:top;height:66px;padding:2px;background:#fff;cursor:pointer;overflow:hidden}
.lcal td.we{background:#eef6ea}.lcal td.tr{outline:2px solid var(--red);outline-offset:-2px}.lcal td.hn{box-shadow:inset 0 0 0 2px var(--g2)}.lcal td.sl{background:#d6ecde}
.lcal td .n{font-size:12px;color:var(--mut)}
.cd{display:inline-block;font-size:10px;font-weight:bold;border-radius:4px;padding:1px 4px;margin:1px 1px 0 0;background:#e6f2ea;color:var(--g)}
.cd.nghi{background:#e3f0f7;color:#1f5a7a}.cd.bad{background:#fdecea;color:var(--red)}
.hatw{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:#fff}
table.hat{border-collapse:collapse;font-size:12px}
table.hat th,table.hat td{border:1px solid var(--line);padding:3px 4px;text-align:center;min-width:34px}
table.hat td.nm,table.hat th.nm{position:sticky;left:0;background:#fff;text-align:left;min-width:130px;max-width:150px;z-index:1;white-space:nowrap}
table.hat .we{background:#eef6ea}table.hat td.tr{background:#fdecea;color:var(--red);font-weight:bold}
table.hat .me td.nm{background:#e6f2ea;font-weight:bold}
.kg{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px}
@media(min-width:620px){.kg{grid-template-columns:repeat(3,1fr)}}
.kpi{background:#fff;border:1px solid var(--line);border-top:4px solid var(--g2);border-radius:12px;padding:10px 8px;text-align:center}
.kpi .kl{font-size:11px;font-weight:bold;color:#596b62}.kpi .kv{font-size:22px;font-weight:bold;margin:4px 0}.kpi .ks{font-size:11px;color:var(--mut)}
.bars .br{display:flex;align-items:center;gap:8px;margin:5px 0;font-size:13px}
.bars .bl{width:120px;flex:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bars .bt{flex:1;background:#eef2f0;border-radius:6px;height:16px;overflow:hidden}.bars .bf{height:100%;border-radius:6px}
.bars .bv{width:70px;flex:none;text-align:right;font-weight:bold}
.cols{display:flex;align-items:flex-end;gap:4px;height:150px;margin-top:8px}
.cols .cc{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.cols .cb{width:100%;border-radius:4px 4px 0 0;min-height:1px}.cols .cn{font-size:9px;color:var(--mut)}.cols .ct{font-size:9px}
.net{background:#c0392b;color:#fff;font-size:11px;padding:3px 8px;border-radius:10px}
.hc{background:#fff;color:var(--g);font-size:12px;font-weight:bold;padding:3px 8px;border-radius:10px;cursor:pointer}
.hc.loi{background:#fbe3e0;color:#c0392b}
.anhluoi{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:6px 0 8px}
.anhluoi.lon{grid-template-columns:repeat(3,1fr);padding:0 12px}
.anho{position:relative;aspect-ratio:1/1;background:#eef2ef;border-radius:8px;overflow:hidden;cursor:pointer}
.anho img{width:100%;height:100%;object-fit:cover;display:block}
.anhx{position:absolute;top:3px;right:3px;width:28px!important;height:28px;padding:0!important;border-radius:50%!important;background:rgba(0,0,0,.6)!important;color:#fff!important;border:0!important;font-size:14px;min-height:0!important}
.anhnho{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.45);color:#fff;font-size:11px;padding:2px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.anhov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:80;display:flex;justify-content:center;align-items:stretch}
.anhnoi{background:#fff;width:100%;max-width:720px;overflow-y:auto}
.anhdau{display:flex;gap:8px;align-items:center;padding:12px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:1;flex-wrap:wrap}
.anhdau .anhtd{flex:1;min-width:150px}
.anhkhung{background:#111;display:flex;justify-content:center;align-items:center;min-height:240px}
.anhto{max-width:100%;max-height:70vh;display:block}
.xlov{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:70;display:flex;align-items:flex-end;justify-content:center}
.xlbox{background:#fff;border-radius:16px 16px 0 0;padding:18px 16px 22px;width:100%;max-width:520px}
.xlbox button{width:100%}
.toast{position:fixed;left:50%;bottom:32px;transform:translateX(-50%);background:#1d2b24;color:#fff;padding:12px 18px;border-radius:12px;font-size:16px;z-index:60;max-width:90%}
.capnhat{position:fixed;left:0;right:0;bottom:0;background:#fff8e1;border-top:2px solid #e0b000;padding:10px 14px;display:flex;gap:12px;align-items:center;justify-content:center;z-index:70;font-size:16px}
.capnhat .p{width:auto;padding:8px 16px}
.sync{font-size:18px;opacity:.85;animation:quay 1.2s linear infinite}
@keyframes quay{to{transform:rotate(360deg)}}
.gbtn{display:flex;justify-content:center;margin:16px 0 6px;min-height:44px}
.stack{display:flex;height:22px;border-radius:6px;overflow:hidden;margin:8px 0}
main.wide{max-width:1160px}
.chg{display:grid;grid-template-columns:1fr;gap:0 12px}
@media(min-width:760px){.chg{grid-template-columns:1fr 1fr}.chg .full{grid-column:1 / -1}}
.card.ch .gt{margin-top:0}
.lg{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:#33443b;margin:8px 0 4px}
.lg i,.dlg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.hc{margin-top:6px}
.hr{display:flex;align-items:center;gap:8px;padding:4px 0;border-bottom:1px solid #f0f3f1}
.hr:last-child{border-bottom:none}
.hl{width:118px;flex:none;font-size:12px;color:#33443b;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbs{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0}
.hb{display:flex;align-items:center;gap:6px;height:12px}
.hf{height:12px;border-radius:0 4px 4px 0;min-width:0;cursor:default}
/* tổng hợp theo cán bộ: thanh chồng */
.cbr{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid #f0f3f1}
.cbr:last-child{border-bottom:none}
.cbr .cbn{width:150px;flex:none;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cbr .cbn i{font-style:normal;color:var(--mut);display:inline-block;min-width:22px}
.cbr .cbt{flex:1;display:flex;height:16px;min-width:0;background:#eef2f0;border-radius:4px;overflow:hidden}
.cbr .cbt span{height:100%;cursor:default}.cbr .cbt span:first-child{border-radius:4px 0 0 4px}.cbr .cbt span:last-child{border-radius:0 4px 4px 0}
.cbr .cbv{width:44px;flex:none;text-align:right;font-weight:bold;font-size:13px}
.cbr.khong .cbn,.cbr.khong .cbv{color:#a3aea8}
.cbnav{display:flex;gap:6px;align-items:center;margin:8px 0}.cbnav b{flex:1;text-align:center}.cbnav button{padding:6px 14px}
@media(max-width:480px){.cbr .cbn{width:118px;font-size:12px}.cbtab button{padding:8px 4px;font-size:15px;white-space:nowrap}}
.hv{font-size:11px;color:#52514e;white-space:nowrap}
.vch{display:flex;align-items:stretch;gap:3px;height:170px;margin-top:8px;border-bottom:1px solid #cfd8d3}
.vc{flex:1;display:flex;flex-direction:column;align-items:center;min-width:0;border-radius:4px 4px 0 0}
.vc.in{background:#f1f6f3}
.vt{font-size:9px;color:#52514e;height:13px;white-space:nowrap}
.vbs{flex:1;width:100%;display:flex;align-items:flex-end;justify-content:center;gap:2px}
.vf{flex:1;max-width:24px;border-radius:4px 4px 0 0;cursor:default}
.vn{font-size:10px;color:var(--mut);padding-top:2px}
.dnw{display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin-top:6px}
.dn{width:150px;height:150px}.dn circle{cursor:default}.dnv{font-size:24px;font-weight:bold;fill:#1d2b24}
.dlg div{display:flex;align-items:center;gap:4px;font-size:13px;margin:4px 0}.dlg b{margin-left:8px}
.kpi{border-top-color:#cfd8d3}.kpi .kv{color:#1d2b24}
.tip{position:absolute;z-index:50;background:#1d2b24;color:#fff;font-size:12px;padding:5px 8px;border-radius:6px;pointer-events:none;display:none;max-width:260px}
table.hat td.on{box-shadow:inset 0 0 0 2px var(--g2);background:#d6ecde}
table.cmt td{max-width:92px;min-width:56px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer;font-size:11px}
table.tbl{border-collapse:collapse;font-size:12px;width:100%}table.tbl th,table.tbl td{border:1px solid var(--line);padding:4px 6px;text-align:right}
table.tbl th{background:#e6f2ea}table.tbl td:first-child,table.tbl th:first-child{text-align:left;position:sticky;left:0;background:#fff}
@media print{header,.tabs,.noprint,#back{display:none!important}body{background:#fff}.card,.kpi{break-inside:avoid}}
</style>
</head>
<body>
<header><span class="back" id="back" style="display:none">&#8592;</span><img class="logo" src="logo.png" alt="Kiểm lâm"><h1><span id="donvi">HẠT KIỂM LÂM TƯƠNG DƯƠNG</span><small>Hệ thống quản lý công tác</small></h1><span class="phai"><span id="hc" class="hc" style="display:none"></span><span id="sync" class="sync" style="display:none" title="Đang cập nhật dữ liệu mới">⟳</span><span id="net" class="net" style="display:none">Mất mạng</span></span></header>
<main id="app"><div class="card">Đang tải…</div></main>
<script>
var $=function(id){return document.getElementById(id)};
var ME=null, CFG=null;
/* ===== KẾT NỐI MÁY CHỦ (ứng dụng PWA gọi thẳng cổng dữ liệu Apps Script) ===== */
var CH=window.CAU_HINH||{};
var PHIEN_KEY='qlct_phien';
function phien(){try{return JSON.parse(localStorage.getItem(PHIEN_KEY)||'null')}catch(e){return null}}
function luuPhien(token,exp,email){try{localStorage.setItem(PHIEN_KEY,JSON.stringify({token:token,exp:exp,email:email||((phien()||{}).email)||''}))}catch(e){}}
function xoaPhien(){try{localStorage.removeItem(PHIEN_KEY)}catch(e){}}
function post(body){
  if(!CH.API_URL)return Promise.reject(new Error('Chưa cấu hình API_URL trong config.js.'));
  return fetch(CH.API_URL,{method:'POST',body:JSON.stringify(body),redirect:'follow'})
    .catch(function(){var e=new Error(navigator.onLine?'Không kết nối được máy chủ. Thử lại sau ít phút.':'Không có mạng. Kiểm tra kết nối rồi thử lại.');e.mang=true;throw e})
    .then(function(r){return r.text()})
    .then(function(t){try{return JSON.parse(t)}catch(e){throw new Error('Máy chủ trả về dữ liệu không hợp lệ. Kiểm tra API_URL và bản triển khai Cổng dữ liệu.')}});
}
function call(action,params,khongXepHang){
  var ph=phien();
  if(!ph||!ph.token){dangNhapView();return new Promise(function(){})}
  params=params||{};
  var xh=HANG_CHO_ACT[action]&&!khongXepHang;
  if(xh){
    if(!params.cid)params.cid=Date.now().toString(36)+Math.random().toString(36).slice(2,10);
    if(!navigator.onLine)return Promise.resolve(xepHang(action,params));
  }
  return post({pwa:1,action:action,params:params,token:ph.token}).catch(function(e){
    if(xh&&e&&e.mang)return {__offline:xepHang(action,params)};
    throw e;
  }).then(function(r){
    if(r&&r.__offline)return r.__offline;
    if(r&&r.loai==='PHIEN_HET_HAN'){xoaPhien();dangNhapView(r.message);return new Promise(function(){})}
    if(r&&r._token){luuPhien(r._token,r._exp);delete r._token;delete r._exp}
    if(r&&r.khoa&&typeof r.khoa==='string'&&ME&&ME.state==='OK'){ME.khoa=ME.khoa||{};ME.khoa[r.khoa]=ME.khoa[r.khoa]||{lyDo:''}}
    if(!CHI_DOC[action]&&r&&r.ok){cxoa('v',!GHI_XOA_HET[action]);if(GHI_XOA_HET[action])cxoa('c')}
    return r;
  });
}
/* ===== LƯU DỮ LIỆU TRÊN MÁY (giai đoạn 2) =====
   callView: màn hình xem – hiện ngay bản đã lưu, tải bản mới ngầm, khác thì vẽ lại (nếu người dùng chưa chuyển màn hình).
   callCfg : cấu hình form – dùng bản đã lưu, làm mới ngầm cho lần sau.
   Ghi/sửa/xóa thành công → xóa bản lưu của các màn hình xem. */
var VIEW=0,LATEST={},PENDING=0;
var GHI_XOA_HET={QT_SUA_NGUOI:1,QT_DOI_NAM:1,DUYET:1,GUI_YEU_CAU:1};
var CHI_DOC={BB_DS:1,BB_CAUHINH:1,BB_PL:1,ANH_DS:1,ANH_LAY:1,PUSH_DANGKY:1,PUSH_HUY:1,PUSH_THU:1,ME:1,NK_CAUHINH:1,NV_CAUHINH:1,SLT_CAUHINH:1,NK_DS:1,NV_DS:1,SLT_DS:1,SLT_LAY:1,LICH_THANG:1,BC_TINH:1,CM_LAY:1,QT_CAUHINH:1,DS_YEU_CAU:1};
function ckey(kind,action,params){return 'qlct_c:'+((phien()||{}).email||'')+':'+kind+':'+action+':'+JSON.stringify(params||{})}
function cget(k){try{var o=JSON.parse(localStorage.getItem(k)||'null');if(o&&Date.now()-o.t<30*864e5)return o}catch(e){}return null}
function cset(k,d){
  var v=JSON.stringify({t:Date.now(),d:d});
  try{localStorage.setItem(k,v)}catch(e){cdon(true);try{localStorage.setItem(k,v)}catch(e2){}}
}
function ckeys(){var a=[];try{for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(k&&k.indexOf('qlct_c:')===0)a.push(k)}}catch(e){}return a}
/* đầy bộ nhớ: xóa một nửa bản lưu cũ nhất */
function cdon(){var a=ckeys().map(function(k){var o=cget(k);return {k:k,t:o?o.t:0}}).sort(function(x,y){return x.t-y.t});a.slice(0,Math.ceil(a.length/2)).forEach(function(x){try{localStorage.removeItem(x.k)}catch(e){}})}
function cxoa(kind,giuME){ckeys().forEach(function(k){var p=k.split(':');if((!kind||p[2]===kind)&&!(giuME&&p[3]==='ME'))try{localStorage.removeItem(k)}catch(e){}})}
function dongBoHien(){var n=$('sync');if(n)n.style.display=PENDING>0?'':'none'}
function callView(action,params){
  var k=ckey('v',action,params),hit=cget(k),okFns=[],errFns=[],v1=-1,my=LATEST[action]=(LATEST[action]||0)+1;
  var obj={then:function(f){okFns.push(f);return obj},catch:function(f){errFns.push(f);return obj}};
  function fire(d){okFns.forEach(function(f){f(d)})}
  setTimeout(function(){
    if(hit){fire(hit.d);v1=VIEW}
    PENDING++;dongBoHien();
    call(action,params).then(function(r){
      PENDING--;dongBoHien();
      if(r&&r.ok)cset(k,r);
      var s1=hit?JSON.stringify(hit.d):'';
      if(hit&&JSON.stringify(r)===s1)return;
      if(hit&&(VIEW!==v1||LATEST[action]!==my))return;      // người dùng đã chuyển màn hình / đã tải lại
      var y=window.scrollY;fire(r);if(hit)setTimeout(function(){window.scrollTo(0,y)},0);
    }).catch(function(e){
      PENDING--;dongBoHien();
      if(!hit)errFns.forEach(function(f){f(e)});
    });
  },0);
  return obj;
}
function callCfg(action,apply){
  var k=ckey('c',action,{}),hit=cget(k);
  var net=call(action).then(function(r){if(r&&r.ok){cset(k,r);if(hit)apply(r)}return r});
  if(hit){net.catch(function(){});return Promise.resolve(hit.d)}
  return net;
}
/* tải sẵn ngầm các màn hình hay dùng để lần mở sau hiện ngay (và chuẩn bị cho dùng offline) */
function taiSan(){
  if(!navigator.onLine)return;
  var t=new Date(),th=t.getFullYear()+'-'+('0'+(t.getMonth()+1)).slice(-2);
  var ds=[['c','NK_CAUHINH',{}],['c','NV_CAUHINH',{}],['v','LICH_THANG',{thang:th,pham:'toi'}],['v','CM_LAY',{thang:th}]];
  (function next(i){
    if(i>=ds.length)return;
    var x=ds[i],k=ckey(x[0],x[1],x[2]),o=cget(k);
    if(o&&Date.now()-o.t<15*60000)return next(i+1);
    call(x[1],x[2]).then(function(r){if(r&&r.ok)cset(k,r);next(i+1)}).catch(function(){});
  })(0);
}

/* ===== HÀNG CHỜ GHI KHI MẤT MẠNG (giai đoạn 3) =====
   Ghi nhật ký / đăng ký nghỉ (NK_LUU) và hoạt động chuyên môn (CM_LUU) khi mất mạng được giữ trên máy,

var HANG_CHO_ACT={NK_LUU:1,CM_LUU:1},DANG_GUI=false;

  if(x.action==='NK_LUU')return (p.hd||'Nhật ký')+' · '+ng+' · '+(p.buoi||'')+(Array.isArray(p.nhap)&&p.nhap.length?' · cho: '+p.nhap.join(', '):(p.nhap?' · cho: '+p.nhap:''))+(p.dd?' · 📍 '+p.dd:'');

/* gửi lần lượt các mục chờ; mục bị máy chủ từ chối (trùng buổi…) giữ lại kèm lỗi để người dùng xử lý */
function dongBo(cb){
  if(DANG_GUI||!navigator.onLine||!(phien()||{}).token){if(cb)cb();return}
  var a=hangCho().filter(function(x){return !x.loi});
  if(!a.length){if(cb)cb();return}
  DANG_GUI=true;PENDING++;dongBoHien();var ok=0;
  (function next(i){
    if(i>=a.length){DANG_GUI=false;PENDING--;dongBoHien();hangChoHien();if(ok)thongBao('Đã gửi '+ok+' mục ghi khi mất mạng.');if(cb)cb();return}
    var x=a[i];
    call(x.action,x.params,true).then(function(r){
      var q=hangCho(),k=q.findIndex(function(y){return y.id===x.id});
      if(r&&r.ok){if(k>=0)q.splice(k,1);ok++}
      else if(k>=0){q[k].loi=(r&&r.message)||'Máy chủ từ chối.';if(r&&r.trung)q[k].loi+=' '+r.trung.map(function(t){return t.ten+' '+fmtVN(t.ngay)+' '+t.buoi+' ('+t.hd+')'}).join('; ')}
      luuHangCho(q);next(i+1);
    }).catch(function(){DANG_GUI=false;PENDING--;dongBoHien();if(cb)cb()});      // mất mạng giữa chừng: thử lại sau
  })(0);
}
window.addEventListener('online',function(){setTimeout(function(){dongBo()},1500)});
document.addEventListener('DOMContentLoaded',function(){var b=$('hc');if(b)b.addEventListener('click',hangChoView)});
if(document.readyState!=='loading')setTimeout(function(){var b=$('hc');if(b&&!b.__gan){b.__gan=1;b.addEventListener('click',hangChoView)}},0);

      el('button',{class:'d',text:'Bỏ mục này',onclick:function(){if(!confirm('Bỏ mục chưa gửi này? Dữ liệu sẽ mất.'))return;luuHangCho(hangCho().filter(function(y){return y.id!==x.id}));hangChoView()}})]));

var BAN_MOI=false,LAN_KT=0;
function kiemTraBanMoi(){
  if(Date.now()-LAN_KT<60000)return;LAN_KT=Date.now();
  try{fetch('index.html',{cache:'no-store'}).catch(function(){});fetch('config.js',{cache:'no-store'}).catch(function(){})}catch(e){}
  /* So trực tiếp với GitHub (không qua bộ nhớ của service worker): mã chương trình khác bản đang chạy → có bản mới */
  try{fetch(location.pathname+'?kt='+Date.now(),{cache:'no-store'}).then(function(r){return r.ok?r.text():''}).then(function(t){
    if(!t)return;
    var moi=[],re=/<script>([\s\S]*?)<\/script>/g,m;while((m=re.exec(t)))moi.push(m[1]);
    var cu=[].filter.call(document.scripts,function(x){return !x.src}).map(function(x){return x.textContent});
    if(moi.length&&moi.join('')!==cu.join(''))coBanMoi();
  }).catch(function(){})}catch(e){}

    var g=location.pathname.replace(/[^\/]*$/,'');return Promise.all([c.delete(g,{ignoreSearch:true}),c.delete(g+'index.html',{ignoreSearch:true}),c.delete(g+'config.js',{ignoreSearch:true})])})}))}).then(xong,xong);return}}catch(e){}

}

/* ===== THÔNG BÁO ĐẨY (Firebase Cloud Messaging) =====
   Cần trong config.js: FIREBASE (cấu hình ứng dụng web Firebase) và VAPID_KEY (Web Push certificate). */
var FB_VER='10.13.2',MSG=null;
function pkey(){return 'qlct_push:'+((phien()||{}).email||'')}
function laIOS(){return /iPhone|iPad|iPod/i.test(navigator.userAgent)}
function daCaiApp(){return (window.matchMedia&&matchMedia('(display-mode: standalone)').matches)||navigator.standalone===true}
function pushHoTro(){return !!(CH.FIREBASE&&CH.FIREBASE.apiKey&&CH.VAPID_KEY&&'serviceWorker' in navigator&&'PushManager' in window&&'Notification' in window)}
function tenMay(){var u=navigator.userAgent,os=/Android/i.test(u)?'Android':laIOS()?'iPhone/iPad':/Windows/i.test(u)?'Windows':/Mac/i.test(u)?'Mac':'Khác';
  var br=/Edg\//.test(u)?'Edge':/Chrome\//.test(u)?'Chrome':/Safari\//.test(u)?'Safari':/Firefox\//.test(u)?'Firefox':'';return os+(br?' · '+br:'')+(daCaiApp()?' · app':'')}
function napJs(src){return new Promise(function(res,rej){var x=document.createElement('script');x.src=src;x.onload=res;x.onerror=function(){rej(new Error('Không tải được thư viện thông báo (kiểm tra mạng).'))};document.head.appendChild(x)})}
function napFirebase(){
  if(MSG)return Promise.resolve(MSG);
  var b='https://www.gstatic.com/firebasejs/'+FB_VER+'/';
  return napJs(b+'firebase-app-compat.js').then(function(){return napJs(b+'firebase-messaging-compat.js')}).then(function(){
    if(!firebase.apps.length)firebase.initializeApp(CH.FIREBASE);
    MSG=firebase.messaging();
    // ứng dụng đang mở: hiện thông báo nhỏ trong app
    MSG.onMessage(function(p){var d=(p&&p.data)||{};thongBao('🔔 '+(d.title?d.title+': ':'')+(d.body||''))});
    return MSG;
  });
}
function layToken(){return napFirebase().then(function(m){return navigator.serviceWorker.ready.then(function(reg){return m.getToken({vapidKey:CH.VAPID_KEY,serviceWorkerRegistration:reg})})})}
function batThongBao(){
  return Notification.requestPermission().then(function(q){
    if(q!=='granted')throw new Error(q==='denied'?'Thông báo đang bị chặn. Bấm biểu tượng ổ khóa/ⓘ cạnh thanh địa chỉ (hoặc Cài đặt điện thoại → Ứng dụng → Chrome → Thông báo) để cho phép rồi thử lại.':'Bạn chưa cho phép thông báo.');
    return layToken();
  }).then(function(t){
    if(!t)throw new Error('Không lấy được mã thông báo của máy.');
    return call('PUSH_DANGKY',{token:t,tb:tenMay()}).then(function(r){
      if(!r||!r.ok)throw new Error((r&&r.message)||'Không đăng ký được.');
      try{localStorage.setItem(pkey(),t)}catch(e){}
      return r;
    });
  });
}
function tatThongBao(){
  var t=null;try{t=localStorage.getItem(pkey());localStorage.removeItem(pkey())}catch(e){}
  return (t?call('PUSH_HUY',{token:t}):Promise.resolve()).then(function(){return napFirebase().then(function(m){return m.deleteToken()}).catch(function(){})});
}
/* mở app: mã của máy có thể được Firebase đổi → cập nhật lên máy chủ; đồng thời bật nhận thông báo khi app đang mở */
function lamMoiToken(){
  try{if(!pushHoTro()||Notification.permission!=='granted'||!localStorage.getItem(pkey())||!navigator.onLine)return}catch(e){return}
  layToken().then(function(t){
    if(t&&t!==localStorage.getItem(pkey()))call('PUSH_DANGKY',{token:t,tb:tenMay()}).then(function(r){if(r&&r.ok)try{localStorage.setItem(pkey(),t)}catch(e){}});
  }).catch(function(){});
}
function moiBatThongBao(){

  box.appendChild(el('p',{},[el('button',{class:'p',text:'Bật thông báo',onclick:function(){

function tbView(){

/* ---- PHỤ LỤC 3 (.xlsx) từ mẫu mau/phu_luc.xlsx ----
   ds: [{ten, chucVu, rows:[{nd, giao, han, sp, sl, ngayHT}]}], thang: 'yyyy-MM' */
var PLX={
  MIME:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet',
  esc:function(s){return String(s).replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g,'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')},
  so:function(s){var m=String(s||'').match(/^(\d{4})-(\d{2})-(\d{2})/);return m?Math.round((Date.UTC(+m[1],+m[2]-1,+m[3])-Date.UTC(1899,11,30))/864e5):null},
  ten:function(s){return String(s).replace(/[\[\]:*?\/\\]/g,'-').slice(0,31)},
  sheet:function(x,ng,thang){
    var m=thang.split('-');
    x=x.replace('{{THANG}}',PLX.esc('(Tháng '+Number(m[1])+' năm '+m[0]+')'))
       .replace('{{HOTEN}}',PLX.esc('- Họ và tên: '+ng.ten)).replace('{{CHUCVU}}',PLX.esc('- Chức vụ: '+(ng.chucVu||'')));
    var proto=x.match(/<row r="15"[^>]*>[\s\S]*?<\/row>/)[0],st={};
    proto.replace(/<c r="([A-Z]+)15" s="(\d+)"/g,function(_,c,s){st[c]=s});
    var rows=ng.rows||[],N=Math.max(rows.length+3,5),cuoi=14+N,lech=cuoi-39,o=[];
    function c(col,r,v,loai){
      var s=' s="'+st[col]+'"',ref=col+r;
      if(v===''||v===null||v===undefined)return '<c r="'+ref+'"'+s+'/>';
      if(loai==='f')return '<c r="'+ref+'"'+s+'><f>'+PLX.esc(v)+'</f></c>';
      if(typeof v==='number')return '<c r="'+ref+'"'+s+'><v>'+v+'</v></c>';
      return '<c r="'+ref+'"'+s+' t="inlineStr"><is><t xml:space="preserve">'+PLX.esc(v)+'</t></is></c>';
    }
    for(var i=0;i<N;i++){
      var r=15+i,d=rows[i]||null,ht='';
      if(d){var L=Math.max(Math.ceil(String(d.nd||'').length/30),Math.ceil(String(d.sp||'').length/19),1);ht=' ht="'+Math.max(15.75,L*15.75+2)+'" customHeight="1"'}
      o.push('<row r="'+r+'" spans="1:15"'+ht+'>'+
        c('A',r,i+1)+c('B',r,d?d.nd:'')+c('C',r,d?PLX.so(d.giao):'')+c('D',r,d?PLX.so(d.han):'')+c('E',r,d?d.sp||'':'')+
        c('F',r,d?5:'')+c('G',r,'')+c('H',r,'IF(F'+r+'="","",F'+r+'*G'+r+')','f')+c('I',r,d?Number(d.sl)||0:'')+
        c('J',r,'IF(F'+r+'="","",F'+r+'*N(I'+r+'))','f')+c('K',r,'')+c('L',r,'IF(J'+r+'="","",MAX(0,J'+r+'-N(K'+r+')*25%*J'+r+'))','f')+
        c('M',r,d?PLX.so(d.ngayHT):'')+c('N',r,'')+c('O',r,'IF(J'+r+'="","",MAX(0,J'+r+'-N(N'+r+')*25%*J'+r+'))','f')+'</row>');
    }
    // dời phần cuối (từ dòng 40) xuống theo số dòng dữ liệu
    var doi=function(r){r=Number(r);return r>=40?r+lech:(r===39?cuoi:r)};
    x=x.replace(/<row r="(\d+)"([^>]*)>([\s\S]*?)<\/row>/g,function(all,r,at,ben){
      if(Number(r)<40)return all;
      ben=ben.replace(/ r="([A-Z]+)(\d+)"/g,function(_,c,rr){return ' r="'+c+doi(rr)+'"'})
             .replace(/<f>([^<]*)<\/f>/g,function(_,f){return '<f>'+f.replace(/([A-Z]+)(\d+)/g,function(__,c,rr){return c+doi(rr)})+'</f>'});
      return '<row r="'+doi(r)+'"'+at+'>'+ben+'</row>';
    });
    x=x.replace(/<mergeCell ref="([A-Z]+)(\d+):([A-Z]+)(\d+)"\/>/g,function(_,a,r1,b,r2){return '<mergeCell ref="'+a+doi(r1)+':'+b+doi(r2)+'"/>'});
    x=x.replace(/<dimension ref="A1:([A-Z]+)(\d+)"\/>/,function(_,c,r){return '<dimension ref="A1:O'+doi(r)+'"/>'});
    x=x.replace(proto,o.join(''));   // chèn dòng dữ liệu sau khi đã dời phần cuối
    return {xml:x,cuoi:48+lech};
  },
  tao:function(ds,thang){
    return taiMau('phu_luc.xlsx').then(function(files){
      var map={};files.forEach(function(f){map[f.n]=f});
      var goc=ZIPR.txt(map['xl/worksheets/sheet1.xml']),relGoc=ZIPR.txt(map['xl/worksheets/_rels/sheet1.xml.rels']);
      var out=files.filter(function(f){return !/^xl\/worksheets\/|^xl\/drawings\/drawing|^xl\/workbook\.xml$|^xl\/_rels\/workbook|^\[Content_Types\]/.test(f.n)});
      var ct=ZIPR.txt(map['[Content_Types].xml']).replace(/<Override PartName="\/xl\/(worksheets\/sheet|drawings\/drawing)\d+\.xml"[^>]*\/>/g,'');
      var wb=ZIPR.txt(map['xl/workbook.xml']),rel=ZIPR.txt(map['xl/_rels/workbook.xml.rels']).replace(/<Relationship Id="rId1"[^>]*worksheet[^>]*\/>/,'');
      var sh=[],dn=[],dung={},them=[];
      ds.forEach(function(ng,i){
        var k=i+1,t=PLX.ten(ng.ten||('PL'+k)),g=t,j=2;while(dung[t.toLowerCase()]){t=g.slice(0,28)+' '+j;j++}dung[t.toLowerCase()]=1;
        var r=PLX.sheet(goc,ng,thang),x=r.xml;
        if(i===0)x=x.replace('<sheetView ','<sheetView tabSelected="1" ');
        out.push({n:'xl/worksheets/sheet'+k+'.xml',d:x});
        out.push({n:'xl/worksheets/_rels/sheet'+k+'.xml.rels',d:relGoc.replace('drawing1.xml','drawing'+k+'.xml')});
        out.push({n:'xl/drawings/drawing'+k+'.xml',d:map['xl/drawings/drawing1.xml'].d});
        them.push('<Override PartName="/xl/worksheets/sheet'+k+'.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/drawings/drawing'+k+'.xml" ContentType="application/vnd.openxmlformats-officedocument.drawing+xml"/>');
        sh.push('<sheet name="'+PLX.esc(t).replace(/"/g,'&quot;')+'" sheetId="'+k+'" r:id="rIdS'+k+'"/>');
        rel=rel.replace('</Relationships>','<Relationship Id="rIdS'+k+'" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet'+k+'.xml"/></Relationships>');
        dn.push('<definedName name="_xlnm.Print_Area" localSheetId="'+i+'">\''+PLX.esc(t).replace(/'/g,"''")+'\'!$A$1:$O$'+r.cuoi+'</definedName>');
      });
      wb=wb.replace(/<sheets>[\s\S]*?<\/sheets>/,'<sheets>'+sh.join('')+'</sheets>').replace(/<definedNames>[\s\S]*?<\/definedNames>/,'<definedNames>'+dn.join('')+'</definedNames>');
      out.unshift({n:'xl/_rels/workbook.xml.rels',d:rel});
      out.unshift({n:'xl/workbook.xml',d:wb});
      out.unshift({n:'[Content_Types].xml',d:ct.replace('</Types>',them.join('')+'</Types>')});
      return XL.zip(out,PLX.MIME);
    });
  }
};

function bbGom(f){
  var g=JSON.parse(JSON.stringify(f));
  if(g.mau==='TN')g.canCu=String(g.canCu||'').split(/\r?\n/).map(function(t){return t.trim()}).filter(Boolean);
  return g;
}

  thongBao('Đang tạo file Word…',1500);

/* ---- Phụ lục 3 ---- */
function plView(body){
  var d=new Date(),th=d.getFullYear()+'-'+pad(d.getMonth()+1);
  var thang=el('input',{type:'month',value:th}),chon={},msg=el('div',{});
  chon[BBCFG.ten]=true;
  var con=[el('p',{class:'hello',text:'Phụ lục 3 – Theo dõi, đánh giá công việc của công chức'}),
    el('div',{class:'hint',text:'Tổng hợp từ nhật ký trong tháng: hoạt động lặp lại được gộp (số lượng = số lần ghi nhật ký, ngày hoàn thành = lần cuối); văn bản tham mưu và nhiệm vụ được giao mỗi việc một dòng (có ngày giao, hạn, văn bản). Hệ số quy đổi mặc định 5. Các cột số lượng giao, làm lại, chậm tiến độ… bạn tự bổ sung trong Excel.'}),
    el('label',{class:'l',text:'Tháng'}),thang];
  if(BBCFG.quanTri){
    var pick=el('div',{class:'pick'});
    var tatCa=el('input',{type:'checkbox'});
    var veChon=function(){pick.innerHTML='';
      pick.appendChild(el('label',{},[tatCa,el('b',{text:'Chọn tất cả'})]));
      (BBCFG.nguoi||[]).forEach(function(n){
        var cb=el('input',{type:'checkbox'});cb.checked=!!chon[n.ten];
        cb.onchange=function(){if(cb.checked)chon[n.ten]=true;else delete chon[n.ten]};
        pick.appendChild(el('label',{},[cb,el('span',{text:n.ten+(n.ten===BBCFG.ten?' (tôi)':'')})]));
      });
    };
    tatCa.onchange=function(){chon={};if(tatCa.checked)(BBCFG.nguoi||[]).forEach(function(n){chon[n.ten]=true});veChon()};
    veChon();
    con.push(el('label',{class:'l',text:'Xuất cho (mỗi người một sheet)'}),pick);
  }
  var nut=el('button',{class:'p',style:'width:100%;margin-top:14px',text:'📥 Xuất phụ lục 3 (Excel)'});
  nut.onclick=function(){
    var ds=Object.keys(chon);if(!ds.length){alert('Chọn ít nhất một người.');return}
    if(!thang.value){alert('Chọn tháng.');return}
    nut.disabled=true;msg.innerHTML='';msg.appendChild(el('p',{class:'mut',text:'Đang tổng hợp…'}));
    call('BB_PL',{thang:thang.value,nguoi:BBCFG.quanTri?ds:[BBCFG.ten]}).then(function(r){
      if(!r||!r.ok)throw new Error((r&&r.message)||'Lỗi');
      return PLX.tao(r.ds,r.thang).then(function(blob){
        nut.disabled=false;msg.innerHTML='';
        msg.appendChild(el('div',{class:'ok',text:r.ds.map(function(x){return x.ten+': '+x.rows.length+' dòng'}).join(' · ')}));
        var tm=r.thang.split('-');
        chiaSeFile(blob,'PL3_'+(r.ds.length===1?khongDauTen(r.ds[0].ten)+'_':'')+'T'+tm[1]+'_'+tm[0]+'.xlsx','📊');
      });
    }).catch(function(e){nut.disabled=false;msg.innerHTML='';msg.appendChild(el('div',{class:'err',text:errMsg(e)}))});
  };
  body.appendChild(el('div',{class:'card'},con.concat([nut,msg])));
}

/* Bản đồ: mã nằm ở bando.js (nạp khi cần) – xem bản đồ nền theo xã, vị trí GPS, nhập track/vùng vi phạm, biên tập & in sơ đồ */

/* ---------- duyệt người dùng ---------- */

/* ---------- NHẬT KÝ ---------- */
function nkHome(tab,edit,preset){
  if(CFG){nkRender(tab||'ghi',edit,preset);return}
  show([msgCard('Đang tải cấu hình…')],boot);
  callCfg('NK_CAUHINH',function(r){CFG=r}).then(function(r){
    if(!r||!r.ok){show([msgCard((r&&r.message)||'Lỗi',true)],boot);return}
    CFG=r;nkRender(tab||'ghi',edit,preset);
  }).catch(function(e){show([msgCard('Lỗi: '+errMsg(e),true,[retry(function(){nkHome()})])],boot)});
}
function nkRender(tab,edit,preset){
  var t1=el('button',{class:tab==='ghi'?'on':'',text:edit?'Sửa nhật ký':'Ghi mới',onclick:function(){nkRender('ghi')}});
  var t2=el('button',{class:tab==='ds'?'on':'',text:'Danh sách',onclick:function(){nkRender('ds')}});
  var body=el('div',{});
  show([el('div',{class:'tabs'},[t1,t2]),body],boot);
  if(tab==='ghi')nkForm(body,edit,preset);else nkList(body);
}
function pad(n){return ('0'+n).slice(-2)}
function dstr(y,m,d){return y+'-'+pad(m+1)+'-'+pad(d)}
function fmtVN(s){var p=s.split('-');return p[2]+'/'+p[1]+'/'+p[0]}

/* preset.nv = {ma,ten}: chế độ báo hoàn thành nhiệm vụ (ghi nhật ký kèm theo rồi đánh dấu hoàn thành) */
function nkForm(body,edit,preset){
  preset=preset||{};var NV=edit?null:preset.nv||null;
  var selDates={};
  var today=CFG.homNay.split('-'),cy=+today[0],cm=+today[1]-1;
  if(edit){selDates[edit.ngay]=true;var ep=edit.ngay.split('-');cy=+ep[0];cm=+ep[1]-1}
  else if(preset.ngay){selDates[preset.ngay]=true;var pp=preset.ngay.split('-');cy=+pp[0];cm=+pp[1]-1}
  var nhapSel=null;
  if(CFG.quanTri){
    nhapSel=el('select',{},CFG.tatCaNguoi.map(function(n){return el('option',{value:n.ten,text:n.ten+(n.ten===CFG.ten?' (tôi)':'')})}));
    nhapSel.value=edit?edit.nhap:(preset.nhap||CFG.ten);
    if(NV)nhapSel.disabled=true;
  }
  var ghepHint=el('div',{class:'hint'});
  var buoi=edit?edit.buoi:'';
  var fieldBox=el('div',{}),calBox=el('div',{class:'cal'}),selBox=el('div',{class:'sels'}),msg=el('div',{});
  var hdSel=el('select',{},[el('option',{value:'',text:'— Chọn hoạt động —'})]);
  CFG.hoatDong.forEach(function(h,i){hdSel.appendChild(el('option',{value:String(i),text:h.name}))});
  var nd=el('textarea',{rows:'2',placeholder:'Nội dung công việc (không bắt buộc)'});
  /* người tham gia ngoài danh sách cán bộ (trưởng bản, công an xã, chủ rừng…): mỗi người một dòng */
  var khacTa=el('textarea',{rows:'3',placeholder:'Mỗi người một dòng, ví dụ:\nÔng Lô Văn A – Trưởng bản Xốp Pột\nBà Vi Thị B – Công an xã'});
  khacTa.value=((edit?edit.khac:preset.khac)||[]).join('\n');
  /* Địa điểm = chọn xã + ghi cụ thể (bản, tiểu khu…). Lưu dạng "ghi cụ thể, Xã". */
  var ddXa=el('select',{},[el('option',{value:'',text:'— Không chọn xã —'})].concat((CFG.xa||[]).map(function(x){return el('option',{value:x,text:x})})));
  var ddTxt=el('input',{type:'text',placeholder:'Ghi cụ thể: bản, tiểu khu, cơ quan… (không bắt buộc)'});
  function ddSet(v){
    v=v||'';var found='';
    (CFG.xa||[]).slice().sort(function(a,b){return b.length-a.length}).forEach(function(x){if(!found&&v.toLowerCase().indexOf(x.toLowerCase())>=0)found=x});
    ddXa.value=found;
    var rest=found?v.replace(new RegExp('\\s*,?\\s*'+found.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\s*$','i'),''):v;
    if(found&&rest===v)rest=v.toLowerCase()===found.toLowerCase()?'':v;
    ddTxt.value=rest;
  }
  function ddGet(){var a=ddTxt.value.trim(),b=ddXa.value;if(a&&b&&a.toLowerCase().indexOf(b.toLowerCase())>=0)return a;return [a,b].filter(Boolean).join(', ')}
  ddSet(edit?edit.dd:(preset.dd||CFG.diaBan||''));
  var search=el('input',{type:'text',placeholder:'Tìm tên…'});
  var pickBox=el('div',{class:'pick'});
  var chosen={};
  if(edit)edit.cung.forEach(function(n){chosen[n]=true});
  else (preset.cung||[]).forEach(function(n){if(n!==(preset.nhap||CFG.ten))chosen[n]=true});
  (CFG.quanTri?CFG.tatCaNguoi:CFG.nguoi).forEach(function(n){
    var cb=el('input',{type:'checkbox'});cb.checked=!!chosen[n.ten];
    cb.addEventListener('change',function(){chosen[n.ten]=cb.checked});
    var lb=el('label',{'data-n':n.ten.toLowerCase()},[cb,el('span',{text:n.ten+(n.dia?' ('+n.dia+')':'')})]);
    pickBox.appendChild(lb);
  });
  search.addEventListener('input',function(){
    var q=search.value.toLowerCase();
    Array.prototype.forEach.call(pickBox.children,function(lb){lb.style.display=lb.getAttribute('data-n').indexOf(q)>=0?'':'none'});
  });
  var seg=el('div',{class:'seg'});
  CFG.buoi.forEach(function(b){
    var rd=el('input',{type:'radio',name:'buoi',value:b});
    var lb=el('label',{class:buoi===b?'on':''},[rd,el('span',{text:b})]);
    lb.addEventListener('click',function(){buoi=b;Array.prototype.forEach.call(seg.children,function(x){x.className=''});lb.className='on'});
    seg.appendChild(lb);
  });
  function drawFields(){
    fieldBox.innerHTML='';
    if(hdSel.value==='')return;
    var h=CFG.hoatDong[+hdSel.value];
    h.fields.forEach(function(f){
      var inp;
      if(f.t==='sel'){inp=el('select',{},[el('option',{value:'',text:'—'})].concat(f.opts.map(function(o){return el('option',{value:o,text:o})})))}
      else if(f.t==='date'){inp=el('input',{type:'date'})}
      else{inp=el('input',{type:'text',inputmode:(f.t==='int'||f.t==='dec')?'decimal':'text'})}
      inp.setAttribute('data-k',f.k);
      var pf=preset.f||{};
      var v=edit&&edit.f&&edit.f[f.k]!==undefined&&edit.f[f.k]!==''?String(edit.f[f.k]):(!edit&&pf[f.k]!==undefined&&pf[f.k]!==''?String(pf[f.k]):(!edit&&f.def!==''&&f.def!==null&&f.def!==undefined?String(f.def):''));
      inp.value=v;
      fieldBox.appendChild(el('label',{class:'l'},[f.label,f.req?el('i',{text:' *'}):null]));
      fieldBox.appendChild(inp);
    });
  }
  hdSel.addEventListener('change',function(){drawFields();var h=hdSel.value===''?null:CFG.hoatDong[+hdSel.value];ghepHint.textContent=h&&h.ghep?'Hoạt động này được ghi chung buổi với hoạt động khác.':''});
  if(edit){
    CFG.hoatDong.forEach(function(h,i){if(h.name===edit.hd)hdSel.value=String(i)});
    nd.value=edit.nd||'';drawFields();
  }else if(preset.hd||preset.nd){
    CFG.hoatDong.forEach(function(h,i){if(h.name===preset.hd)hdSel.value=String(i)});
    nd.value=preset.nd||'';drawFields();
  }
  function drawCal(){
    calBox.innerHTML='';
    var names=['Tháng 1','Tháng 2','Tháng 3','Tháng 4','Tháng 5','Tháng 6','Tháng 7','Tháng 8','Tháng 9','Tháng 10','Tháng 11','Tháng 12'];
    var prev=el('button',{class:'s',text:'‹',onclick:function(){cm--;if(cm<0){cm=11;cy--}drawCal()}});
    var next=el('button',{class:'s',text:'›',onclick:function(){cm++;if(cm>11){cm=0;cy++}drawCal()}});
    calBox.appendChild(el('div',{class:'h'},[prev,el('b',{text:names[cm]+' / '+cy}),next]));
    var tb=el('table',{}),tr=el('tr',{});
    ['T2','T3','T4','T5','T6','T7','CN'].forEach(function(x){tr.appendChild(el('th',{text:x}))});
    tb.appendChild(tr);
    var first=new Date(cy,cm,1),off=(first.getDay()+6)%7,days=new Date(cy,cm+1,0).getDate(),d=1;
    for(var w=0;w<6&&d<=days;w++){
      var r=el('tr',{});
      for(var k=0;k<7;k++){
        if((w===0&&k<off)||d>days){r.appendChild(el('td',{}));continue}
        (function(day){
          var s=dstr(cy,cm,day),dis=(CFG.minNgay&&s<CFG.minNgay)||(CFG.maxNgay&&s>CFG.maxNgay);
          var cls=(selDates[s]?'sel ':'')+(s===CFG.homNay?'today ':'')+(dis?'dis':'');
          var c=el('div',{class:cls,text:String(day)});
          if(!dis)c.addEventListener('click',function(){
            if(edit){selDates={};selDates[s]=true}else{if(selDates[s])delete selDates[s];else selDates[s]=true}
            drawCal();drawSels();
          });
          r.appendChild(el('td',{},[c]));
        })(d);d++;
      }
      tb.appendChild(r);
    }
    calBox.appendChild(tb);
  }
  function drawSels(){
    selBox.innerHTML='';
    var ks=Object.keys(selDates).sort();
    if(!ks.length){selBox.appendChild(el('span',{class:'mut',text:edit?'Chọn ngày thực hiện.':'Chạm vào các ngày để chọn (có thể chọn nhiều ngày).'}));return}
    ks.forEach(function(k){selBox.appendChild(el('span',{class:'chip',text:fmtVN(k)}))});
  }
  drawCal();drawSels();
  /* ảnh hiện trường: ghi mới → chọn ảnh, gửi sau khi lưu; sửa → mở màn ảnh của nhật ký */
  var ANH=edit?null:oChonAnh(),anhSua=el('div',{});
  function anhSync(){
    var h=hdSel.value===''?null:CFG.hoatDong[+hdSel.value],co=!!(h&&h.anh&&ME&&ME.anh);
    if(ANH)ANH.box.style.display=co?'':'none';
    anhSua.innerHTML='';
    if(edit&&(co||(edit.soAnh&&ME&&ME.anh)))anhSua.appendChild(el('p',{},[el('button',{class:'s',text:edit.soAnh?'📷 Ảnh đã gắn ('+edit.soAnh+') – xem, thêm, xóa':'📷 Gắn ảnh cho nhật ký này',onclick:function(){
      xemAnh(edit.ma,edit.hd+' · '+fmtVN(edit.ngay)+' · '+edit.buoi,function(n){edit.soAnh=n;anhSync()})}})]));
  }
  hdSel.addEventListener('change',anhSync);
  function guiAnh(ma,offline,sau){
    var fs=ANH?ANH.files():[];
    if(!fs.length){sau&&sau();return}
    if(offline||!ma){msg.appendChild(el('div',{class:'bad',text:'Ảnh chưa được gửi vì đang mất mạng. Khi có mạng, mở nhật ký này (Danh sách → Sửa, hoặc Lịch công tác) để gắn ảnh.'}));sau&&sau();return}
    var tb=el('div',{class:'mut',text:'Đang gửi ảnh…'});msg.appendChild(tb);
    taiAnhLen(ma,fs,function(i,n){tb.textContent='Đang gửi ảnh '+i+'/'+n+'…'}).then(function(k){
      tb.textContent='';
      msg.appendChild(el('div',{class:k.loi.length?'bad':'ok',text:'Đã gửi '+k.xong+'/'+fs.length+' ảnh.'+(k.loi.length?' Lỗi: '+k.loi.join('; '):'')}));
      if(!k.loi.length)ANH.xoaHet();
      sau&&sau();
    });
  }
  var LBL=edit?'Lưu thay đổi':(NV?'Báo hoàn thành':'Ghi nhật ký');
  var btn=el('button',{class:'p',text:LBL,onclick:save});
  var btnChi=NV?el('button',{class:'s',text:'Chỉ báo hoàn thành, không ghi nhật ký',onclick:function(){
    if(!confirm('Báo hoàn thành nhiệm vụ mà không ghi nhật ký?\nNgày hoàn thành sẽ tự ghi là hôm nay.'))return;
    btnChi.disabled=true;
    call('NV_XONG',{ma:NV.ma}).then(function(r){btnChi.disabled=false;if(r&&r.ok)xongOk(r);else msg.appendChild(el('div',{class:'bad',text:(r&&r.message)||'Không xử lý được.'}))})
      .catch(function(e){btnChi.disabled=false;msg.appendChild(el('div',{class:'bad',text:errMsg(e)}))});
  }}):null;
  function xongOk(r){
    msg.innerHTML='';btn.style.display='none';if(btnChi)btnChi.style.display='none';
    msg.appendChild(el('div',{class:'ok'},[el('b',{text:'Đã báo hoàn thành nhiệm vụ '+NV.ma+(r.nk?' và ghi '+r.nk.soDong+' dòng nhật ký.':'.')}),
      r.nk?el('div',{class:'mut',text:'Mã nhật ký: '+r.nk.ma.join(', ')+' – đã hiện trên lịch công tác.'}):null,
      el('p',{},[el('button',{class:'s',text:'Về danh sách nhiệm vụ',onclick:function(){nvHome('ds')}})])]));
    if(r.nk)warnBox(msg,r.nk.canhBao);
    if(r.nk&&r.nk.ma)guiAnh(r.nk.ma[0],false);
    window.scrollTo(0,document.body.scrollHeight);
  }
  function save(){
    msg.innerHTML='';
    if(hdSel.value===''){alert('Vui lòng chọn hoạt động.');return}
    var h=CFG.hoatDong[+hdSel.value],ks=Object.keys(selDates).sort();
    if(!ks.length){alert('Vui lòng chọn ngày.');return}
    if(!buoi){alert('Vui lòng chọn buổi.');return}
    var f={};
    Array.prototype.forEach.call(fieldBox.querySelectorAll('[data-k]'),function(i){f[i.getAttribute('data-k')]=i.value});
    var cung=Object.keys(chosen).filter(function(k){return chosen[k]});
    var p={hd:h.name,ngay:ks,buoi:buoi,cung:cung,nd:nd.value,dd:CFG.coDiaDiem?ddGet():'',f:f};
    if(!(edit&&edit.khac===undefined&&!khacTa.value.trim()))p.khac=khacTa.value;   // bản lưu cũ chưa có thông tin này: không gửi để máy chủ giữ nguyên
    if(edit)p.ma=edit.ma;
    if(nhapSel)p.nhap=nhapSel.value;
    btn.disabled=true;btn.textContent='Đang lưu…';
    (NV?call('NV_XONG',{ma:NV.ma,nk:p}):call(edit?'NK_SUA':'NK_LUU',p)).then(function(r){
      btn.disabled=false;btn.textContent=LBL;
      if(r&&r.ok&&NV){xongOk(r);return}
      if(r&&r.ok){
        if(edit){if(r.canhBao&&r.canhBao.length)alert('Đã lưu. Lưu ý: '+canhBaoText(r.canhBao));nkRender('ds');return}
        msg.appendChild(el('div',{class:'ok'},[el('b',{text:r.offline?('Đang mất mạng: đã lưu '+r.soDong+' dòng trên máy, sẽ tự gửi khi có mạng.'):('Đã ghi '+r.soDong+' dòng nhật ký.')}),el('div',{class:'mut',text:r.offline?'Xem ở biểu tượng ⇅ trên đầu trang.':'Mã: '+r.ma.join(', ')}),
          el('p',{},[el('button',{class:'s',text:'Ghi tiếp',onclick:function(){nkRender('ghi')}}),' ',el('button',{class:'s',text:'Xem danh sách',onclick:function(){nkRender('ds')}})])]));
        warnBox(msg,r.canhBao);
        guiAnh(r.ma&&r.ma[0],r.offline);
        window.scrollTo(0,document.body.scrollHeight);
      }else if(r&&r.loai==='TRUNG'){

function makePick(users,chosen,single,onchange){
  var box=el('div',{class:'pick'}),inputs={};
  var search=el('input',{type:'text',placeholder:'Tìm tên…'});
  users.forEach(function(n){
    var cb=el('input',{type:'checkbox'});cb.checked=!!chosen[n.ten];inputs[n.ten]=cb;
    cb.addEventListener('change',function(){
      if(single&&cb.checked){Object.keys(chosen).forEach(function(k){delete chosen[k]});Object.keys(inputs).forEach(function(k){if(inputs[k]!==cb)inputs[k].checked=false})}
      if(cb.checked)chosen[n.ten]=true;else delete chosen[n.ten];
      if(onchange)onchange();
    });
    box.appendChild(el('label',{'data-n':n.ten.toLowerCase()},[cb,el('span',{text:n.ten+(n.dia?' ('+n.dia+')':'')})]));
  });
  search.addEventListener('input',function(){
    var q=search.value.toLowerCase();
    Array.prototype.forEach.call(box.children,function(lb){lb.style.display=lb.getAttribute('data-n').indexOf(q)>=0?'':'none'});
  });
  return {search:search,box:box};
}

/* Báo hoàn thành: mở mẫu nhật ký điền sẵn từ nhiệm vụ */
function nvHdGoiY(e){
  var ds=(CFG.hoatDong||[]).filter(function(h){return !h.nghi});
  function by(f){for(var i=0;i<ds.length;i++)if(f(ds[i]))return ds[i].name;return ''}
  if(e.hdNk&&by(function(h){return h.name===e.hdNk}))return e.hdNk;
  if(e.loai==='Tham mưu văn bản')return by(function(h){return h.code==='VB'});
  if(e.loai==='Hồ sơ thanh toán')return by(function(h){return h.code==='HSTT'});
  var t=(e.ten||'').toLowerCase();
  return by(function(h){return t.indexOf(h.name.toLowerCase())>=0})||'';
}

/* danh sách ngày từ a đến b (yyyy-mm-dd), có thể bỏ thứ 7, chủ nhật */
function dayRange(a,b,boCuoiTuan){
  var out=[];if(!a||!b||a>b)return out;
  var p=a.split('-'),d=new Date(+p[0],+p[1]-1,+p[2]);
  for(var i=0;i<400;i++){
    var s=d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
    if(s>b)break;
    var w=d.getDay();if(!(boCuoiTuan&&(w===0||w===6)))out.push(s);
    d.setDate(d.getDate()+1);
  }
  return out;
}

    if(!p.v)return;

    svg.appendChild(c);off+=len;
  });
  var t=document.createElementNS(ns,'text');t.setAttribute('x',70);t.setAttribute('y',76);t.setAttribute('text-anchor','middle');t.setAttribute('class','dnv');t.textContent=String(tot);svg.appendChild(t);

  return el('div',{class:'dnw'},[svg,lg]);

/* ===================== ẢNH HIỆN TRƯỜNG =====================
   Ảnh nén ngay trên máy (cạnh dài 1600 px, JPEG ~300–500 KB) + ảnh nhỏ 360 px, gửi lên máy chủ lưu vào Google Drive của hạt.
   Xem / tải về: mọi người. Xóa: người tải lên hoặc quản trị. */
var ANH_NHO={};   // bộ nhớ ảnh nhỏ đã tải: id → dataURL
function nenAnh(file){
  function ve(src,w,h){
    function lay(max,q){var k=Math.min(1,max/Math.max(w,h)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(w*k));c.height=Math.max(1,Math.round(h*k));
      var g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(src,0,0,c.width,c.height);return c.toDataURL('image/jpeg',q).split(',')[1]}
    return {data:lay(1600,0.82),nho:lay(360,0.7),ten:file.name||'anh.jpg'};
  }
  if(window.createImageBitmap)return createImageBitmap(file,{imageOrientation:'from-image'}).then(function(b){var x=ve(b,b.width,b.height);try{b.close()}catch(e){}return x}).catch(function(){return quaImg()});
  return quaImg();
  function quaImg(){return new Promise(function(ok,loi){var u=URL.createObjectURL(file),im=new Image();
    im.onload=function(){try{ok(ve(im,im.naturalWidth,im.naturalHeight))}catch(e){loi(e)}URL.revokeObjectURL(u)};
    im.onerror=function(){URL.revokeObjectURL(u);loi(new Error('Không đọc được ảnh '+(file.name||'')))};im.src=u})}
}
/* gửi lần lượt các ảnh đang chờ lên nhật ký ma; bao(i,n) để báo tiến độ */
function taiAnhLen(ma,files,bao){
  var i=0,loi=[],xong=0;
  function tiep(){
    if(i>=files.length)return Promise.resolve({xong:xong,loi:loi});
    var f=files[i++];bao&&bao(i,files.length);
    return nenAnh(f).then(function(a){return call('ANH_TAI',{ma:ma,ten:a.ten,data:a.data,nho:a.nho})})
      .then(function(r){if(r&&r.ok)xong++;else loi.push((f.name||'ảnh')+': '+((r&&r.message)||'lỗi'))})
      .catch(function(e){loi.push((f.name||'ảnh')+': '+errMsg(e))}).then(tiep);
  }
  return tiep();
}

/* ---- Lưới tháng theo cán bộ (giống bảng "Cả hạt" và bảng chuyên môn trên app) ---- */
function xlLuoi(r,nguoi,rong,tieuDe,phuDe,cm){
  var n=r.soNgay,rows=[],mg=[],wd=['CN','T2','T3','T4','T5','T6','T7'],cols=[24];
  xlDau(rows,mg,n+1,tieuDe,phuDe);
  var h1=[{v:'Cán bộ',s:13}],h2=[{v:'',s:13}];
  for(var d=1;d<=n;d++){var dow=(r.thuDau+d-1)%7,we=dow===0||dow===6;h1.push({v:d,s:we?6:13});h2.push({v:wd[dow],s:we?6:13});cols.push(rong)}
  rows.push(h1,h2);mg.push('A5:A6');
  if(!cm)for(var j=0;j<n;j++){   // độ rộng cột theo mã dài nhất trong ngày (như bảng trên app)
    var dai=2;nguoi.forEach(function(p){var t=String(p.o[j]||'');if(t.length>dai)dai=t.length});
    cols[j+1]=Math.max(5,Math.round((dai*1.25+1.5)*10)/10);
  }
  nguoi.forEach(function(p){
    var row=[{v:p.ten,s:3}];
    p.o.forEach(function(t,i){
      var dow=(r.thuDau+i)%7,we=dow===0||dow===6;t=String(t||'');
      if(cm){row.push({v:t,s:we?22:21});return}
      var c=lichCodes(t),txt=t.replace(/!$/,'')+(c.bad?'!':'');
      row.push({v:txt,s:c.bad?14:(we?8:7)});
    });
    rows.push(row);
  });
  return {rows:rows,merges:mg,cols:cols};
}

function xlLichToi(r,tieuDe,phuDe){
  var rows=[],mg=[],ht={},nghi={};r.chuThich.forEach(function(x){if(x.nghi)nghi[x.code]=true});
  xlDau(rows,mg,7,tieuDe,phuDe);
  rows.push(['T2','T3','T4','T5','T6','T7','CN'].map(function(x,k){return {v:x,s:k>=5?6:13}}));
  var off=(r.thuDau+6)%7,d=1;
  for(var w=0;w<6&&d<=r.soNgay;w++){
    var row=[];
    for(var k=0;k<7;k++){
      if((w===0&&k<off)||d>r.soNgay){row.push({v:'',s:23});continue}
      var c=lichCodes(r.o[d-1]||''),we=k>=5,rich=[{t:String(d),c:'6B7A72',sz:10}];
      c.codes.forEach(function(cd,i){rich.push({t:(i?'  ':'\n')+cd+(c.bad?'!':''),b:1,sz:11,c:c.bad?'C0392B':(nghi[cd]?'1F5A7A':'1F5C3A')})});
      row.push({rich:rich,s:c.bad?(we?20:19):(we?18:17)});d++;
    }
    ht[rows.length]=48;rows.push(row);
  }
  return {rows:rows,merges:mg,cols:[15,15,15,15,15,15,15],ht:ht};
}
function xuatLich(r){

    var dk=xlSapNgay(r.muc.filter(function(x){return x.nghi}));
    L.rows.push([]);L.rows.push([{v:'LỊCH NGHỈ ĐÃ ĐĂNG KÝ TRONG THÁNG',s:0}]);
    if(!dk.length)L.rows.push([{v:'Chưa đăng ký ngày nghỉ nào.',s:5}]);
    else{var hi=L.rows.length+1;L.rows.push([{v:'Ngày',s:13},{v:'Buổi',s:13},{v:'Loại nghỉ',s:13},{v:'',s:13},{v:'',s:13}]);L.merges.push('C'+hi+':E'+hi)}

  }
  xlBangMa(L,r,LICH_GHI_CHU);

    {ten:'Chi tiết',cols:[6,12,9,22,26,26,8,40,24,36,22],rows:rows,merges:mg,freeze:{r:5},ngang:true}]);
}

/* ---------- HOẠT ĐỘNG CHUYÊN MÔN ---------- */
var CM={thang:null,ten:'',ngay:0};
function cmHome(){
  if(!CM.thang){var d=new Date();CM.thang=d.getFullYear()+'-'+pad(d.getMonth()+1)}
  cmLoad();
}
function cmShift(delta){var p=CM.thang.split('-'),d=new Date(+p[0],+p[1]-1+delta,1);CM.thang=d.getFullYear()+'-'+pad(d.getMonth()+1);CM.ngay=0;cmLoad()}
function cmLoad(){
  show([msgCard('Đang tải…')],boot);
  callView('CM_LAY',{thang:CM.thang}).then(function(r){
    if(!r||!r.ok){show([msgCard((r&&r.message)||'Lỗi',true,[retry(cmLoad)])],boot);return}
    cmRender(r);
  }).catch(function(e){show([msgCard('Lỗi: '+errMsg(e),true,[retry(cmLoad)])],boot)});
}
function cmItem(x,r){
  var kids=[el('div',{class:'top'},[el('div',{class:'hd',text:x.nd+(x.code?' ('+x.code+')':'')}),el('div',{class:'mut',text:fmtVN(x.ngay)+' · '+x.buoi})]),
    el('div',{class:'mut',text:'Người đăng ký: '+x.nhap+(x.cung.length?' · Cùng: '+x.cung.join(', '):'')})];
  if(x.gc)kids.push(el('div',{text:'📝 '+x.gc}));
  if(x.sua)kids.push(el('div',{class:'btns'},[
    el('button',{class:'s',text:'Sửa',onclick:function(){cmForm(r,x)}}),
    el('button',{class:'d',text:'Xóa',onclick:function(){
      if(!confirm('Xóa hoạt động "'+x.nd+'" ngày '+fmtVN(x.ngay)+' ('+x.buoi+')?'))return;
      call('CM_XOA',{ma:x.ma}).then(function(q){if(q&&q.ok)cmLoad();else alert((q&&q.message)||'Không xóa được.')}).catch(function(e){alert(errMsg(e))});
    }})]));
  else kids.push(el('div',{class:'hint',text:'Chỉ '+x.nhap+' (người đăng ký) hoặc quản trị mới sửa/xóa được.'}));
  return el('div',{class:'item'},kids);
}
function cmRender(r){
  var prev=el('button',{class:'s',text:'‹',onclick:function(){cmShift(-1)}}),next=el('button',{class:'s',text:'›',onclick:function(){cmShift(1)}});
  var mi=el('input',{type:'month',value:r.thang});
  mi.addEventListener('change',function(){if(mi.value){CM.thang=mi.value;CM.ngay=0;cmLoad()}});
  var nodes=[el('div',{class:'card'},[el('div',{class:'lnav'},[prev,mi,next]),
    el('p',{},[el('button',{class:'p',text:'Đăng ký hoạt động chuyên môn',onclick:function(){cmForm(r,null,{})}}),' ',nutExcel('CM',function(){xuatChuyenMon(r)})]),
    r.canhBao?el('div',{class:'hint',text:r.canhBao}):null])];
  var tb=el('table',{class:'hat'}),h1=el('tr',{}),h2=el('tr',{}),wd=['CN','T2','T3','T4','T5','T6','T7'];
  var tenMa={};(r.hoatDong||[]).forEach(function(h){tenMa[h.code]=h.name});
  var tieuDeO=function(t){return lichCodes(t).codes.map(function(c){return c+(tenMa[c]?' = '+tenMa[c]:'')}).join('\n')};
  h1.appendChild(el('th',{class:'nm',text:'Cán bộ'}));h2.appendChild(el('th',{class:'nm',text:''}));
  for(var d=1;d<=r.soNgay;d++){var dow=(r.thuDau+d-1)%7,we=dow===0||dow===6;h1.appendChild(el('th',{class:we?'we':'',text:String(d)}));h2.appendChild(el('th',{class:we?'we':'',text:wd[dow]}))}
  tb.appendChild(h1);tb.appendChild(h2);
  r.nguoi.forEach(function(p){var row=el('tr',{class:p.ten===r.ten?'me':''});row.appendChild(el('td',{class:'nm',text:p.ten}));
    p.o.forEach(function(t,i){var dow=(r.thuDau+i)%7,on=CM.ten===p.ten&&CM.ngay===i+1;
      row.appendChild(el('td',{class:((dow===0||dow===6)?'we ':'')+(on?'on':''),title:tieuDeO(t),text:t,onclick:function(){CM.ten=p.ten;CM.ngay=i+1;cmRender(r)}}))});
    tb.appendChild(row)});
  nodes.push(el('div',{class:'hatw'},[tb]));
  var maDung=cmMaDung(r);
  if(maDung.length)nodes.push(el('div',{class:'card'},[el('div',{class:'hint',text:'Bảng mã:'}),
    el('div',{class:'mut'},maDung.map(function(x){return el('span',{class:'cd',text:x.code+(x.name?' = '+x.name:'')})})),
    el('div',{class:'hint',text:'Hai mã nối bằng dấu / là buổi sáng / buổi chiều.'})]));
  if(CM.ngay&&CM.ten){
    var ds=r.thang+'-'+pad(CM.ngay),ten=CM.ten;
    var items=r.muc.filter(function(x){return x.ngay===ds&&x.ds.indexOf(ten)>=0});
    var det=[el('div',{class:'gt',text:ten+' – ngày '+fmtVN(ds)})];
    if(!items.length)det.push(el('div',{class:'mut',text:'Chưa có hoạt động chuyên môn.'}));
    items.forEach(function(x){det.push(cmItem(x,r))});
    det.push(el('p',{},[el('button',{class:'s',text:'Đăng ký ngày này',onclick:function(){cmForm(r,null,{ngay:ds,nhap:r.quanTri?ten:'',cung:!r.quanTri&&ten!==r.ten?[ten]:[]})}})]));
    nodes.push(el('div',{class:'card'},det));
  }else nodes.push(el('div',{class:'hint',text:'Chạm vào một ô để xem chi tiết, sửa hoặc xóa. Mỗi người mỗi buổi chỉ có một hoạt động chuyên môn; buổi đã có người đăng ký thì chỉ người đăng ký đầu tiên (hoặc quản trị) sửa được.'}));
  show(nodes,boot);
}
/* các mã đang có trong bảng tháng (để làm bảng mã) */
function cmMaDung(r){
  var tenMa={},co={},out=[];(r.hoatDong||[]).forEach(function(h){tenMa[h.code]=h.name});
  r.nguoi.forEach(function(p){p.o.forEach(function(t){lichCodes(t).codes.forEach(function(c){if(!co[c]){co[c]=1;out.push({code:c,name:tenMa[c]||''})}})})});
  return out.filter(function(x){return x.name}).concat(out.filter(function(x){return !x.name}));
}
function cmForm(r,edit,preset){
  preset=preset||{};
  var sel={};if(edit)sel[edit.ngay]=true;else if(preset.ngay)sel[preset.ngay]=true;
  var selBox=el('div',{class:'sels'}),msg=el('div',{}),buoi=edit?edit.buoi:'Cả ngày';
  function drawSels(){selBox.innerHTML='';var ks=Object.keys(sel).sort();
    if(!ks.length){selBox.appendChild(el('span',{class:'mut',text:edit?'Chọn ngày.':'Chạm vào các ngày (có thể chọn nhiều ngày).'}));return}
    ks.forEach(function(k){selBox.appendChild(el('span',{class:'chip',text:fmtVN(k)}))})}
  var cal=makeCal({homNay:r.homNay,minNgay:'',maxNgay:r.maxNgay},sel,drawSels,!!edit);drawSels();
  var seg=el('div',{class:'seg'});
  r.buoi.slice().reverse().forEach(function(b){
    var lb=el('label',{class:b===buoi?'on':''},[el('span',{text:b})]);
    lb.addEventListener('click',function(){buoi=b;Array.prototype.forEach.call(seg.children,function(x){x.className=''});lb.className='on'});
    seg.appendChild(lb);
  });
  /* nội dung = chọn hoạt động trong danh sách (như nhật ký); bảng tháng chỉ hiện mã */
  var nd=el('select',{},[el('option',{value:'',text:'— Chọn hoạt động —'})].concat((r.hoatDong||[]).map(function(h){return el('option',{value:h.name,text:h.name+' ('+h.code+')'})})));
  if(edit){
    if(!(r.hoatDong||[]).some(function(h){return h.name===edit.nd}))nd.appendChild(el('option',{value:edit.nd,text:edit.nd+' (nội dung cũ, ghi tay)'}));
    nd.value=edit.nd;
  }
  var gc=el('input',{type:'text',maxlength:String(r.maxGc||200),placeholder:'Ghi chú thêm (không bắt buộc, không hiện trong bảng)'});if(edit)gc.value=edit.gc||'';

  var owner=null;

/* ---------- QUẢN LÝ (quản trị) ---------- */
function qtView(){
  show([msgCard('Đang tải…')],boot);
  call('QT_CAUHINH').then(function(r){
    if(!r||!r.ok){show([msgCard((r&&r.message)||'Lỗi',true)],boot);return}
    qtRender(r);
  }).catch(function(e){show([msgCard('Lỗi: '+errMsg(e),true,[retry(qtView)])],boot)});
}
function qtRender(r){

    if(!confirm('Đổi năm sử dụng chung từ '+r.nam+' sang '+n+'?\n\nCác bảng tháng trong sheet (LICH_CONG_TAC, HOAT_DONG_CHUYEN_MON, TONG_HOP) sẽ chuyển sang năm '+n+'. Dữ liệu năm '+r.nam+' vẫn được giữ trong các sheet dữ liệu và vẫn xem được trên web.'))return;

      kh[c.ma]?el('div',{class:'mut',style:'margin-left:30px;font-size:12px',text:'Khóa từ '+fmtVN(kh[c.ma].ngay)+(kh[c.ma].boi?' – '+kh[c.ma].boi:'')}):null]));
  });
  var kb=el('button',{class:'p',text:'Lưu khóa chức năng',onclick:function(){
    var ds=dongKh.filter(function(d){return d.x.checked}),lyDo={};

    kb.disabled=true;kmsg.innerHTML='';
    call('QT_KHOA',{khoa:ds.map(function(d){return d.ma}),lyDo:lyDo}).then(function(x){kb.disabled=false;
      if(x&&x.ok){r.khoa=x.khoa;ME.khoa=x.khoa;try{cset(ckey('v','ME',{}),ME)}catch(e){}
        kmsg.appendChild(el('div',{class:'ok',text:ds.length?('Đã khóa: '+ds.map(function(d){return (r.dsCn.filter(function(c){return c.ma===d.ma})[0]||{}).ten}).join(', ')+'. Người dùng sẽ thấy khi mở lại ứng dụng.'):'Đã mở khóa tất cả chức năng.'}))}

  var khCard=r.dsCn?el('div',{class:'card'},[el('div',{class:'gt',text:'Khóa chức năng'}),
    el('div',{class:'hint',text:'Chức năng bị khóa: người dùng không vào được, không ghi hay sửa dữ liệu được. Quản trị vẫn dùng bình thường. Khi khóa Nhật ký, người dùng vẫn đăng ký nghỉ ở Lịch công tác và vẫn báo hoàn thành nhiệm vụ (không kèm nhật ký).'}),
    khBox,el('p',{},[kb]),kmsg]):null;
  /* ẩn / hiện nút Xuất Excel */
  var exCard=null;
  if(r.dsExcel){
    var ex=r.excel||{},exMsg=el('div',{}),exDs=[];
    var exBox=el('div',{},r.dsExcel.map(function(c){

    }));
    var exBtn=el('button',{class:'p',text:'Lưu',onclick:function(){

        if(x&&x.ok){r.excel=x.excel;ME.excel=x.excel;try{cset(ckey('v','ME',{}),ME)}catch(e){}

    var ax=el('input',{type:'checkbox'});ax.style.width='auto';ax.checked=!!r.anhBat;
    var aMsg=el('div',{}),aBtn=el('button',{class:'p',text:'Lưu',onclick:function(){

      call('QT_ANH',{bat:ax.checked}).then(function(x){aBtn.disabled=false;

          aMsg.appendChild(el('div',{class:'ok',text:x.anh?'Đã bật chức năng ảnh hiện trường.':'Đã ẩn chức năng ảnh hiện trường (ảnh đã lưu vẫn còn trên Drive).'}))}

    }});
    anhCard=el('div',{class:'card'},[el('div',{class:'gt',text:'Ảnh hiện trường'}),
      el('div',{class:'hint',text:'Mặc định ẩn. Khi bật, nhật ký các hoạt động có "Gắn ảnh = Có" trong DANH_MUC sẽ có nút chụp/chọn ảnh và nút 📷 xem ảnh. Khi ẩn, mọi tài khoản (kể cả quản trị) không thấy chức năng này; ảnh đã lưu vẫn giữ nguyên trên Drive và hiện lại khi bật.'}),
      el('label',{style:'display:flex;gap:10px;align-items:center;margin-top:10px'},[ax,el('span',{text:'📷 Hiện chức năng gắn / xem ảnh hiện trường'})]),
      el('p',{},[aBtn]),aMsg]);
  }
  /* chức năng thử nghiệm: chọn người được thấy (quản trị luôn thấy) */
  var rgCard=null;
  if(r.dsRieng){
    var rg=r.rieng||{},rgMsg=el('div',{}),rgChon={};
    var nguoiHd=r.nguoi.filter(function(u){return u.hoatDong});
    var rgBox=el('div',{},r.dsRieng.map(function(c){
      var chon=rgChon[c.ma]={};(rg[c.ma]||[]).forEach(function(t){chon[t]=true});
      var dem=el('span',{class:'mut'});
      var capDem=function(){dem.textContent=' – '+Object.keys(chon).filter(function(t){return chon[t]}).length+' người được chọn'};capDem();
      var ds=el('div',{class:'pick',style:'max-height:240px;overflow:auto;margin-top:6px'},nguoiHd.map(function(u){

function qtForm(r,u){
  var sel=function(opts,val,blank){var s=el('select',{},(blank?[el('option',{value:'',text:blank})]:[]).concat(opts.map(function(o){return el('option',{value:o,text:o})})));
    if(val&&opts.indexOf(val)<0)s.appendChild(el('option',{value:val,text:val+' (không có trong danh mục)'}));s.value=val||'';return s};
  var nhom=sel(r.nhom,u.nhom),vai=sel(r.vaiTro,u.vai,'(trống)'),dia=sel(r.xa,u.dia,'(không phụ trách xã)');
  var cb=function(v){var x=el('input',{type:'checkbox'});x.checked=!!v;x.style.width='auto';return x};
  var kiem=cb(u.kiem),hd=cb(u.hoatDong),xe=cb(false),msg=el('div',{});
  var row=function(x,t){return el('label',{style:'display:flex;gap:10px;align-items:center;margin-top:12px'},[x,el('span',{text:t})])};
  var btn=el('button',{class:'p',text:'Lưu thay đổi',onclick:function(){
    if(xe.checked&&!confirm('Gỡ email '+u.email+' khỏi '+u.ten+'? Người này sẽ phải gửi yêu cầu liên kết lại.'))return;
    btn.disabled=true;msg.innerHTML='';
    call('QT_SUA_NGUOI',{row:u.row,ten:u.ten,nhom:nhom.value,vai:vai.value,dia:dia.value,kiem:kiem.checked,hoatDong:hd.checked,xoaEmail:xe.checked}).then(function(x){
      btn.disabled=false;
      if(x&&x.ok){if(u.ten===ME.user.ten)alert('Đã lưu. Quyền của chính bạn có hiệu lực khi mở lại trang.');qtView()}
      else msg.appendChild(el('div',{class:'bad',text:(x&&x.message)||'Không lưu được.'}));
    }).catch(function(e){btn.disabled=false;msg.appendChild(el('div',{class:'bad',text:errMsg(e)}))});
  }});
  var nodes=[el('p',{class:'hello',text:u.ten}),
    el('label',{class:'l',text:'Nhóm quyền'}),nhom,
    el('div',{class:'hint',text:'Quản trị hệ thống: toàn quyền · Giao việc: xem tất cả và giao việc · Nhập liệu: ghi dữ liệu của mình.'}),
    el('label',{class:'l',text:'Vai trò'}),vai,
    el('label',{class:'l',text:'Địa bàn phụ trách'}),dia,
    row(kiem,'Kiêm địa bàn'),row(hd,'Đang hoạt động (bỏ chọn để khóa tài khoản)')];

  show([el('div',{class:'card'},nodes),el('div',{class:'card'},[btn,msg])],qtView);
}

/* ---------- DỌN DỮ LIỆU (quản trị) ---------- */
function donView(){
  var mk=function(title,desc,action){
    var msg=el('div',{});
    var b=el('button',{class:'p',text:'Dồn dòng & đánh lại mã',onclick:function(){
      if(!confirm(title+': dồn các dòng lên trên, sắp theo ngày và đánh lại mã từ 0001?\nNên làm khi ít người đang dùng. Mã cũ sẽ thay đổi.'))return;
      b.disabled=true;msg.innerHTML='';msg.appendChild(el('div',{class:'mut',text:'Đang xử lý…'}));
      call(action).then(function(r){b.disabled=false;msg.innerHTML='';
        msg.appendChild(el('div',{class:r&&r.ok?'ok':'bad',text:r&&r.ok?('Xong: '+r.soDong+' dòng dữ liệu, đã bỏ '+r.soTrong+' dòng trống.'):((r&&r.message)||'Lỗi')}));
      }).catch(function(e){b.disabled=false;msg.innerHTML='';msg.appendChild(el('div',{class:'bad',text:errMsg(e)}))});
    }});
    return el('div',{class:'card'},[el('div',{class:'gt',text:title}),el('p',{class:'mut',text:desc}),b,msg]);
  };
  show([msgCard('Ghi mới đã tự lấp vào các dòng trống. Chức năng dưới đây dùng định kỳ (ví dụ cuối tháng) để sắp xếp gọn sheet. Nên đặt tên phiên bản file (File → Lịch sử phiên bản) trước khi chạy.'),
    mk('Nhật ký công tác (NHAT_KY)','Sắp xếp theo ngày, buổi; mã mới NK-0001, NK-0002…','NK_DONDONG'),
    mk('Nhiệm vụ (NHIEM_VU_GIAO)','Sắp xếp theo ngày giao; mã mới NV-0001, NV-0002…','NV_DONDONG')],boot);
}
boot();
